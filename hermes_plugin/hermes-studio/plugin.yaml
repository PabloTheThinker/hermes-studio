name: hermes-studio
version: "0.6.1"
description: >-
  Local NLE for Hermes: long video or link in, captioned shorts out; timeline
  editor, Canva-style designs, photo tools. Whisper + FFmpeg on your machine.
  Never posts.
author: "Pablo Navarro"
homepage: "https://github.com/PabloTheThinker/hermes-studio"
license: MIT
kind: standalone
requires_hermes: ">=0.19.0"
tags: [video, clips, captions, editor, ffmpeg, whisper, nle]
provides_tools:
  - hermes_studio_run
  - hermes_studio_transcribe
  - hermes_studio_plan
  - hermes_studio_list
  - hermes_studio_probe
  - hermes_studio_desk
  - hermes_studio_captions
  - hermes_studio_edit
  - hermes_studio_recommend
  - hermes_studio_copy
  - hermes_studio_restyle
  - hermes_studio_name
  - hermes_studio_design
  - hermes_studio_photo
provides_hooks: []
