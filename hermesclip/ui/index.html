        ${state.captions ? `<div class="opts">${STYLES.map(s => `<button class="opt ${state.style===s?"on":""}" data-k="style" data-v="${s}">${s}</button>`).join("")}</div>
        <input id="keywords" placeholder="Highlight words: money, mistake, never" value="${esc(state.keywords || "")}" />` : ""}
        ${t.id === "clip" ? `<label class="check"><input type="checkbox" id="hook" ${state.hook ? "checked" : ""}> Hook title for the first 3 seconds</label>` : ""}
        </div></section>`;
    }
    function qualitySec() {
      return `<section class="sec"><h3>Transcription</h3><div>
        <div class="opts">${state.quality.map(q => `<button class="opt ${state.whisper===q.id?"on":""}" data-k="whisper" data-v="${q.id}">${esc(q.name)}<small>${esc(q.model || q.line)}</small></button>`).join("")}</div>
        </div></section>`;
    }
    function summary(t) {
      const d = DUR.find(x => x.id === state.dur);
      const bits = [];
      if (t.settings.includes("format")) bits.push(state.aspect === "source" ? "source frame" : state.aspect);
      if (t.settings.includes("length")) bits.push(`${state.max_clips} × ${d ? d.hint : ""}`);
      if (t.settings.includes("captions")) bits.push(state.captions ? state.style : "no captions");
      bits.push(state.whisper);
      return esc(bits.join(" · "));
    }

    /* ---------- Library ---------- */
    function viral(j) {
      const scores = (j.clips || []).map(c => (c.virality != null ? c.virality : Math.round((c.score || 0) * 100)));
      return scores.length ? Math.max(...scores) : 0;
    }
    function libraryPage() {
      if (state.open) return runDetail(state.open);
      const q = (state.q || "").trim().toLowerCase();
      let runs = state.library.slice();
      if (q) runs = runs.filter(j => (j.title || "").toLowerCase().includes(q) || (j.src || "").toLowerCase().includes(q) || (j.platform || "").toLowerCase().includes(q) || (j.clips || []).some(c => (c.title || "").toLowerCase().includes(q)));
      if (!state.library.length) return `<p class="kicker">Library</p><h1>Nothing yet.</h1><div class="empty">Finished runs land here, sorted into a folder per platform.</div>`;
      const folders = state.folders.length ? state.folders : [...new Set(state.library.map(j => j.platform))].map(n => ({ name: n, runs: state.library.filter(j => j.platform === n).length }));
      if (state.folder && !folders.some(f => f.name === state.folder)) state.folder = "";
      if (state.folder) runs = runs.filter(j => j.platform === state.folder);
      const chips = `<div class="folders" role="tablist">
        <button data-folder="" class="${!state.folder ? "on" : ""}">All<b>${state.library.length}</b></button>
        ${folders.map(f => `<button data-folder="${esc(f.name)}" class="${state.folder === f.name ? "on" : ""}">${esc(f.name)}<b>${f.runs}</b></button>`).join("")}
      </div>`;
      const head = `<p class="kicker">Library</p><h1>${state.folder ? esc(state.folder) + "." : folders.length + " folder" + (folders.length === 1 ? "" : "s") + "."}</h1>${chips}`;
      if (!runs.length) return head + `<div class="empty">${q ? "No match. Try another word." : "Nothing in this folder yet."}</div>`;
      const order = folders.map(f => f.name);
      const groups = order.map(name => [name, runs.filter(j => j.platform === name)]).filter(([, rs]) => rs.length);
      return head + groups.map(([name, rs]) => `
        ${state.folder ? "" : `<div class="fold-h"><h2>${esc(name)}</h2><span>${rs.length} run${rs.length === 1 ? "" : "s"}</span></div>`}
        <div class="runs">${rs.map(runRow).join("")}</div>`).join("");
    }
    function runRow(j) {
      const thumb = (j.clips || []).find(c => c.thumb);
      const v = viral(j);
      const n = (j.clips || []).length, f = (j.files || []).length;
      const names = (j.clips || []).slice(0, 2).map(c => c.title).filter(Boolean).join(" · ");
      return `<div class="run-row" data-open="${j.id}" role="button" tabindex="0">
        ${thumb ? `<img src="/media/${j.id}/${thumb.thumb}" alt="">` : `<div class="ph"></div>`}
        <div><h3>${esc(j.title || j.id)}</h3><p>${n ? n + " clip" + (n === 1 ? "" : "s") : ""}${n && f ? " · " : ""}${f ? f + " files" : ""}${j.is_live ? " · live" : ""}${names ? " · " + esc(names) : ""}</p></div>
        <span class="tag">${esc(TOOL_LABEL[j.mode] || "Clips")}</span>
        <span class="score">${j.mode === "clip" && v ? v : ""}</span></div>`;
    }
    function runDetail(j) {
      const copy = state.copy && state.copy.job === j.id ? state.copy : null;
      const wide = j.aspect === "16:9" || j.aspect === "source";
      const files = j.files || [];
      return `<p class="kicker"><a href="#/library" id="back-lib">Library</a> · <a href="#" id="back-folder" data-folder-go="${esc(j.platform || "")}">${esc(j.platform || "Other")}</a> · ${esc(TOOL_LABEL[j.mode] || "Clips")}</p>
        <h1>${esc(j.title)}</h1>
        <p class="lede mono">${esc(j.src)}</p>
        ${state.err ? `<p class="err">${esc(state.err)}</p>` : ""}
        ${files.length ? `<div class="files">${files.map(f => `<a href="/media/${j.id}/${encodeURIComponent(f.file)}" download>${esc(f.label || f.file)}<span>${esc(f.file)}</span></a>`).join("")}</div>` : ""}
        ${j.mode === "transcript" ? `<pre class="tx">${esc(state.tx || "Loading transcript…")}</pre>` : ""}
        ${(j.clips || []).length ? `<div class="row" style="margin:0 0 1.25rem"><button class="btn" id="name-btn" data-job="${j.id}">AI name clips</button><button class="btn" id="copy-btn" data-job="${j.id}">Write social copy</button><span class="hint">${state.nameSrc ? "Named by " + esc(state.nameSrc) + ". Click a name to edit." : "Names come from each clip's words. Click a name to edit."}</span></div>` : ""}
        ${copy ? `<div class="copy"><p class="kicker">${esc(copy.source || "copy")}</p><ul>${(copy.titles || []).map(t => `<li>${esc(t)}</li>`).join("")}</ul><p class="lede" style="margin:0 0 .4rem">${esc(copy.description || "")}</p><p class="hint mono">${esc((copy.hashtags || []).join(" "))}</p></div>` : ""}
        <div class="clips">${(j.clips || []).map(c => `<article class="clip ${wide ? "wide" : ""}">
          <video controls playsinline preload="none" poster="${c.thumb ? `/media/${j.id}/${c.thumb}` : ""}" src="/media/${j.id}/${c.file}"></video>
          <a class="hint mono" style="float:right;margin-top:.8rem;text-decoration:none" href="/media/${j.id}/${c.file}" download="${esc(slugify(c.title || c.file))}.mp4">Save ↓</a>
          <textarea class="ttl" rows="2" data-title="${esc(c.file)}" aria-label="Clip name" maxlength="90">${esc(c.title || c.file)}</textarea>
          <p>${fmt(c.start)}–${fmt(c.end)}${c.virality ? " · " + c.virality : ""}${c.saved ? " · " + c.saved + "s cut" : ""}</p>
          <div class="row">
            <button class="btn sm" data-up="${esc(c.file)}" aria-label="Move up">↑</button>
            <button class="btn sm" data-down="${esc(c.file)}" aria-label="Move down">↓</button>
            <input data-split-at="${esc(c.file)}" placeholder="split s" />
            <button class="btn sm" data-split="${esc(c.file)}">Split</button>
            <button class="btn sm" data-dup="${esc(c.file)}">Copy</button>
            <button class="btn sm quiet" data-drop="${esc(c.file)}">Drop</button>
          </div></article>`).join("")}</div>
        ${(state.trash || []).length ? `<p class="kicker" style="margin-top:2rem">Dropped</p><div class="row">${state.trash.map(t => `<button class="btn sm" data-restore="${esc(t.file)}">Restore ${esc(t.file)}</button>`).join("")}</div>` : ""}`;
    }

    /* ---------- Jobs ---------- */
    function jobsPage() {
      const jobs = state.jobs;
      if (!jobs.length) return `<p class="kicker">Jobs</p><h1>Quiet.</h1><div class="empty">Nothing running. Pick a tool to start.</div>`;
      return `<p class="kicker">Jobs</p><h1>Queue and history.</h1><p class="lede">Two jobs run at once. The rest wait their turn.</p>${jobs.map(j => {
        const pct = Math.round((j.progress || 0) * 100);
        const retry = (j.status === "failed" || j.status === "cancelled") ? `<button class="btn sm" data-retry="${j.id}">Retry</button>` : "";
        const cancel = j.status === "queued" ? `<button class="btn sm" data-cancel="${j.id}">Cancel</button>` : "";
        const done = j.status === "completed" ? `<button class="btn sm" data-view="${j.id}">Open</button>` : "";
        return `<article class="job"><div class="head"><strong>${esc(j.title || j.id)}</strong><span class="st ${esc(j.status)}">${esc(TOOL_LABEL[j.mode] || "Clips")} · ${esc(j.status)}${j.stage && j.stage !== "done" ? " · " + esc(j.stage) : ""}</span></div>
          <p class="hint" style="margin:.3rem 0 0">${esc(j.message || j.error || j.src)}</p>
          ${j.status === "running" || j.status === "queued" ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}
          ${retry || cancel || done ? `<div class="row" style="margin-top:.6rem">${done}${retry}${cancel}</div>` : ""}</article>`;
      }).join("")}`;
    }

    /* ---------- Wiring ---------- */
    function grabForm() {
      const v = (id) => { const el = $("#" + id); return el ? el : null; };
      if (v("src")) state.src = v("src").value.trim();
      if (v("trim")) state.trim = v("trim").checked;
      if (v("start")) state.start = v("start").value;
      if (v("end")) state.end = v("end").value;
      if (v("live_from_start")) state.live_from_start = v("live_from_start").checked;
      if (v("captions")) state.captions = v("captions").checked;
      if (v("hook")) state.hook = v("hook").checked;
      if (v("prompt")) state.prompt = v("prompt").value;
      if (v("keywords")) state.keywords = v("keywords").value;
      if (v("fixes")) state.fixes = v("fixes").value;
      if (v("progress")) state.progress = v("progress").checked;
      if (v("face-ratio")) state.face_ratio = Number(v("face-ratio").value);
      if (v("filter-sel")) state.filter = v("filter-sel").value;
    }
    async function openRun(id, fromRoute) {
      const jj = state.library.find(j => j.id === id);
      if (!fromRoute && jj && (jj.mode || "clip") === "clip") { go("#/clips/" + encodeURIComponent(id)); return; }
      if (!fromRoute) { history.pushState(null, "", "#/library/" + encodeURIComponent(id)); }
      state.page = "library"; state.open = state.library.find(j => j.id === id) || null; state.tx = null; state.err = ""; state.nameSrc = "";
      renderRail();
      try { const t = await api("/api/trash?job=" + encodeURIComponent(id)); state.trash = t.files || []; } catch { state.trash = []; }
      render();
      if (state.open && state.open.mode === "transcript") {
        try { const r = await fetch(`/media/${id}/transcript.txt`); state.tx = r.ok ? await r.text() : "Transcript file missing."; } catch { state.tx = "Transcript file missing."; }
        render();
      }
    }
    function bindClips() {
      if (state.page !== "clips") return;
      bindProjects();
      bindEdit();
      const fs = $("#filter-sel"); if (fs) fs.onchange = () => { grabForm(); render(); };
      const fr = $("#face-ratio"); if (fr) fr.onchange = () => { grabForm(); render(); };
      const more = $("#more-btn"); if (more) more.onclick = () => { grabForm(); state.moreSet = !state.moreSet; render(); };
      const ds = $("#dur-sel"); if (ds) ds.onchange = () => { grabForm(); state.dur = ds.value; render(); };
      const ss = $("#style-sel"); if (ss) ss.onchange = () => { grabForm(); if (ss.value === "off") state.captions = false; else { state.captions = true; state.style = ss.value; } render(); };
      const ls = $("#live-sel"); if (ls) ls.onchange = () => { state.live_seconds = Number(ls.value); };
      const src = $("#src"); if (src) src.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); $("#clip-run").click(); } };
      const run = $("#clip-run");
      if (run) run.onclick = async () => {
        grabForm(); state.err = "";
        if (!state.src) { state.err = "Paste a link or a file path first."; render(); return; }
        const d = DUR.find(x => x.id === state.dur) || DUR[1];
        run.disabled = true; run.textContent = "Starting…";
        try {
          await api("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
            src: state.src, mode: "clip", layout: state.layout, aspect: state.aspect || "9:16", max_clips: state.max_clips,
            min_sec: d.min, max_sec: d.max, style: state.style, captions: state.captions, pacing: state.pacing,
            live_seconds: state.live_seconds, live_from_start: state.live_from_start,
            start_time: state.start ? state.start : null, end_time: state.end ? state.end : null,
            prompt: state.prompt, keywords: state.captions ? state.keywords : "", hook: state.hook, plan: "heuristic", whisper: state.whisper,
            look: lookOf(), fixes: state.fixes,
          })});
          state.src = ""; state.probe = null; state.why = [];
          await refresh(); render();
        } catch (e) { state.err = e.message; render(); }
      };
      document.querySelectorAll("[data-view-k]").forEach(el => el.onclick = () => { state[el.dataset.viewK] = el.dataset.v; render(); });
      document.querySelectorAll("[data-words]").forEach(el => el.onclick = () => el.classList.toggle("open"));
      const tf = $("#to-folder"); if (tf) tf.onclick = (e) => { e.preventDefault(); state.folder = tf.dataset.folderGo; go("#/library"); };
      const clipMeta = async (file, liked) => {
        const j = state.open; if (!j) return;
        try {
          await api("/api/clipmeta", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ job: j.id, file, liked }) });
          const c = (j.clips || []).find(x => x.file === file); if (c) c.liked = liked;
        } catch (e) { state.err = e.message; }
        render();
      };
      document.querySelectorAll("[data-like]").forEach(el => el.onclick = () => { const c = state.open.clips.find(x => x.file === el.dataset.like); clipMeta(el.dataset.like, c && c.liked === true ? null : true); });
      document.querySelectorAll("[data-hide]").forEach(el => el.onclick = () => { const c = state.open.clips.find(x => x.file === el.dataset.hide); clipMeta(el.dataset.hide, c && c.liked === false ? null : false); });
    }
    function bind() {
      bindClips();
      document.querySelectorAll("main [data-tool]").forEach(el => el.onclick = () => pickTool(el.dataset.tool));
      const all = $("#all-tools"); if (all) all.onclick = (e) => { e.preventDefault(); go("#/tools"); };
      document.querySelectorAll("[data-k]").forEach(el => el.onclick = () => { grabForm(); state[el.dataset.k] = el.dataset.n ? Number(el.dataset.v) : el.dataset.v; render(); });
      ["trim", "captions"].forEach(id => { const el = $("#" + id); if (el) el.onchange = () => { grabForm(); render(); }; });
      const probeBtn = $("#probe-btn");
      if (probeBtn) probeBtn.onclick = async () => {
        grabForm(); state.err = "";
        if (!state.src) { state.err = "Paste a source first."; render(); return; }
        probeBtn.disabled = true; probeBtn.textContent = "Checking…";
        try { state.probe = await api("/api/probe?src=" + encodeURIComponent(state.src)); }
        catch (e) { state.probe = { ok: false, error: e.message }; }
        render();
      };
      const bestBtn = $("#best-btn");
      if (bestBtn) bestBtn.onclick = async () => {
        grabForm(); state.err = "";
        if (!state.src) { state.err = "Paste a source first."; render(); return; }
        bestBtn.disabled = true; bestBtn.textContent = "Reading the video…";
        try {
          const data = await api("/api/recommend?src=" + encodeURIComponent(state.src));
          const r = data.recommendation || {};
          state.probe = { ok: true, title: data.title, is_live: data.is_live, duration: data.duration };
          const tool = r.mode === "captions" ? "captions" : "clip";
          if (state.page !== "clips") state.tool = tool;
          Object.assign(state, {
            aspect: r.aspect || "9:16", layout: r.layout || "fit", dur: r.dur || "short", max_clips: r.max_clips || 3,
            pacing: r.pacing || "tight", style: r.style || "pop", captions: r.captions !== false, hook: r.hook !== false,
            live_seconds: r.live_seconds || 1200, why: r.why || [], picked: true,
          });
          if (r.prompt) state.prompt = r.prompt;
          if (r.keywords) state.keywords = r.keywords;
          renderRail();
        } catch (e) { state.err = e.message; }
        render();
      };
      const runBtn = $("#run-btn");
      if (runBtn) runBtn.onclick = async () => {
        grabForm(); state.err = "";
        if (!state.src) { state.err = "Paste a source first."; render(); return; }
        const t = toolById(state.tool);
        const d = DUR.find(x => x.id === state.dur) || DUR[1];
        runBtn.disabled = true; runBtn.textContent = "Queuing…";
        try {
          await api("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
            src: state.src, mode: t.id, layout: state.layout, aspect: state.aspect || "9:16", max_clips: state.max_clips,
            min_sec: d.min, max_sec: d.max, style: state.style, captions: t.id === "captions" ? true : state.captions,
            pacing: state.pacing, live_seconds: state.live_seconds, live_from_start: state.live_from_start,
            start_time: state.trim && state.start ? state.start : null,
            end_time: state.trim && state.end ? state.end : null,
            prompt: t.id === "clip" ? state.prompt : "", keywords: state.captions ? state.keywords : "",
            hook: t.id === "clip" ? state.hook : false,
            plan: "heuristic", whisper: state.whisper,
            look: lookOf(), fixes: state.fixes,
          })});
          state.why = [];
          nav("jobs"); await refresh();
        } catch (e) { state.err = e.message; render(); }
      };
      document.querySelectorAll("[data-open]").forEach(el => {
        el.onclick = () => openRun(el.dataset.open);
        el.onkeydown = (e) => { if (e.key === "Enter") openRun(el.dataset.open); };
      });
      document.querySelectorAll("[data-view]").forEach(el => el.onclick = async () => { await refresh(); openRun(el.dataset.view); });
      document.querySelectorAll("video").forEach(v => v.addEventListener("play", () => document.querySelectorAll("video").forEach(o => { if (o !== v) o.pause(); })));
      document.querySelectorAll("[data-folder]").forEach(el => el.onclick = () => { state.folder = el.dataset.folder; render(); });
      const backFolder = $("#back-folder"); if (backFolder) backFolder.onclick = (e) => { e.preventDefault(); state.folder = backFolder.dataset.folderGo; state.open = null; state.tx = null; render(); };
      const backLib = $("#back-lib"); if (backLib) backLib.onclick = (e) => { e.preventDefault(); go("#/library"); };
      const clipOp = async (file, op, extra) => {
        const jobId = state.open && state.open.id; if (!jobId) return;
        state.err = "";
        try {
          await api("/api/edit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ job: jobId, file, op, ...(extra || {}) }) });
          await refresh();
          state.open = state.library.find(x => x.id === jobId) || state.open;
          const t = await api("/api/trash?job=" + encodeURIComponent(jobId)); state.trash = t.files || [];
        } catch (e) { state.err = e.message; }
        render();
      };
      document.querySelectorAll("[data-split]").forEach(el => el.onclick = () => {
        const file = el.dataset.split;
        const inp = document.querySelector(`[data-split-at="${CSS.escape(file)}"]`);
        const at = Number(inp && inp.value);
        if (!at) { state.err = "Split needs a time in seconds."; render(); return; }
        clipOp(file, "split", { at });
      });
      document.querySelectorAll("[data-up]").forEach(el => el.onclick = () => clipOp(el.dataset.up, "reorder", { dir: "up" }));
      document.querySelectorAll("[data-down]").forEach(el => el.onclick = () => clipOp(el.dataset.down, "reorder", { dir: "down" }));
      document.querySelectorAll("[data-dup]").forEach(el => el.onclick = () => clipOp(el.dataset.dup, "duplicate"));
      document.querySelectorAll("[data-drop]").forEach(el => el.onclick = () => { if (confirm("Drop this clip? It moves to the run's .trash and can be restored.")) clipOp(el.dataset.drop, "drop"); });
      document.querySelectorAll("[data-restore]").forEach(el => el.onclick = () => clipOp(el.dataset.restore, "restore"));
      const nameBtn = $("#name-btn");
      if (nameBtn) nameBtn.onclick = async () => {
        const id = nameBtn.dataset.job;
        nameBtn.disabled = true; nameBtn.textContent = "Naming…"; state.err = "";
        try {
          const r = await api("/api/name", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ job: id }) });
          state.nameSrc = r.source;
          await refresh(); state.open = state.library.find(x => x.id === id) || state.open;
        } catch (e) { state.err = e.message; }
        render();
      };
      document.querySelectorAll("[data-title]").forEach(el => {
        const save = async () => {
          const jobId = state.open && state.open.id; const file = el.dataset.title;
          const clip = (state.open.clips || []).find(c => c.file === file);
          if (!jobId || !clip || el.value.trim() === (clip.title || "")) return;
          try {
            const r = await api("/api/rename", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ job: jobId, file, title: el.value }) });
            clip.title = r.title; el.value = r.title;
          } catch (e) { state.err = e.message; render(); }
        };
        el.onblur = save;
        el.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } if (e.key === "Escape") { const c = (state.open.clips || []).find(x => x.file === el.dataset.title); el.value = c ? c.title : el.value; el.blur(); } };
      });
      const copyBtn = $("#copy-btn");
      if (copyBtn) copyBtn.onclick = async () => {
        const id = copyBtn.dataset.job;
        copyBtn.disabled = true; copyBtn.textContent = "Writing…";
        try { const data = await api("/api/copy?job=" + encodeURIComponent(id)); state.copy = { job: id, ...data }; }
        catch (e) { state.err = e.message; }
        render();
      };
      document.querySelectorAll("[data-retry]").forEach(el => el.onclick = async () => { await api("/api/jobs/" + el.dataset.retry + "/retry", { method: "POST" }); state.sig = ""; refresh(); });
      document.querySelectorAll("[data-cancel]").forEach(el => el.onclick = async () => { await api("/api/jobs/" + el.dataset.cancel + "/cancel", { method: "POST" }); state.sig = ""; refresh(); });
    }
    $("#q").oninput = (e) => { state.q = e.target.value; if (state.page !== "library" || state.open) { state.page = "library"; state.open = null; renderRail(); } render(); };
    loadTools().then(() => refresh()).then(applyRoute); setInterval(refresh, 2500);
  </script>
</body>
</html>
