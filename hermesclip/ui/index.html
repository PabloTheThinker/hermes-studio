<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes Studio</title>
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Hermes Studio: house structure (Vektra v3) in Hermes colors.
       Black canvas, warm ink, hairlines, rows not cards, one accent per screen.
       Accent = Hermes amber (from the Hermes Agent wordmark), not Vektra gold.
       Ember = the wordmark's echo outline; used only for the brand echo and live state. */
    :root {
      --bg: #0b0b0c;
      --panel: #111112;
      --ink: #f2efe8;
      --mute: rgba(242,239,232,.64);
      --dim: rgba(242,239,232,.5);
      --line: rgba(242,239,232,.12);
      --line-2: rgba(242,239,232,.2);
      --amber: #ffc83d;
      --amber-ink: #110c00;
      --ember: #cd8032;
      --bad: #ff6b5b;
      --ease: cubic-bezier(.2,.7,.1,1);
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Archivo", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); font-variation-settings: "wdth" 100; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--amber); color: var(--amber-ink); }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }

    #app { display: grid; grid-template-columns: 248px 1fr; grid-template-rows: 64px 1fr; min-height: 100%; }

    /* Top bar */
    .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 1.25rem; padding: 0 1.25rem; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; }
    .word { position: relative; font-weight: 800; font-variation-settings: "wdth" 125; text-transform: uppercase; letter-spacing: .04em; font-size: 15px; line-height: 1; white-space: nowrap; }
    .word b { color: var(--amber); font-weight: 800; }
    /* the Hermes echo: one offset outline, like the Agent wordmark */
    .word::after { content: attr(data-t); position: absolute; left: 3px; top: 3px; color: transparent; -webkit-text-stroke: 1px var(--ember); opacity: .55; z-index: -1; pointer-events: none; }
    .search { flex: 1; max-width: 440px; }
    .search input { height: 36px; margin: 0; }
    .top-meta { margin-left: auto; display: flex; align-items: center; gap: 1rem; font: 500 11px var(--mono); color: var(--dim); letter-spacing: .04em; }
    .top-meta .run { color: var(--ember); }

    /* Rail */
    aside { border-right: 1px solid var(--line); padding: 1rem 0 1.5rem; display: flex; flex-direction: column; gap: 1.4rem; overflow: auto; }
    .rail-h { font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); padding: 0 1.25rem; margin: 0 0 .35rem; }
    .rail button { display: flex; align-items: baseline; gap: .6rem; width: 100%; background: none; border: 0; border-left: 2px solid transparent; padding: .5rem 1.25rem .5rem calc(1.25rem - 2px); text-align: left; cursor: pointer; color: var(--mute); transition: color .2s var(--ease); }
    .rail button:hover { color: var(--ink); }
    .rail button.on { color: var(--ink); border-left-color: var(--amber); }
    .rail .nm { font-weight: 600; font-size: 14px; }
    .rail .ct { margin-left: auto; font: 500 11px var(--mono); color: var(--dim); }
    .rail .ct.live { color: var(--ember); }
    .rail-foot { margin-top: auto; padding: 0 1.25rem; font-size: 12px; color: var(--dim); line-height: 1.45; }

    main { padding: 2rem clamp(1.25rem, 3vw, 3rem) 4rem; overflow: auto; }
    .wrap { max-width: 980px; }

    /* Type */
    .kicker { font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin: 0 0 .6rem; }
    .kicker a { color: var(--mute); text-decoration: none; border-bottom: 1px solid var(--line-2); }
    .kicker a:hover { color: var(--ink); border-color: var(--amber); }
    h1 { font-weight: 800; font-variation-settings: "wdth" 125; text-transform: uppercase; font-size: clamp(30px, 3.6vw, 52px); line-height: .9; letter-spacing: -.01em; margin: 0 0 .8rem; text-wrap: balance; }
    h2 { font-weight: 600; font-variation-settings: "wdth" 104; font-size: 20px; letter-spacing: -.01em; margin: 0; }
    .lede { color: var(--mute); max-width: 60ch; margin: 0 0 1.6rem; text-wrap: pretty; }
    .hint { color: var(--dim); font-size: 13px; }
    .mono { font-family: var(--mono); font-size: 12px; }
    .err { color: var(--bad); white-space: pre-wrap; border-left: 2px solid var(--bad); padding: .4rem .8rem; margin: 0 0 1rem; }
    .ok { color: var(--ink); }

    /* Forms */
    label.f { display: block; font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin: 0 0 .45rem; }
    input, select { width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 0; padding: .7rem .85rem; font: 14px var(--sans); margin: 0 0 1rem; transition: border-color .2s var(--ease); }
    input:focus, select:focus { border-color: var(--amber); outline: none; }
    input::placeholder { color: var(--dim); }
    .check { display: flex; align-items: center; gap: .6rem; font-size: 14px; color: var(--mute); margin: 0 0 .8rem; cursor: pointer; }
    .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--amber); }
    .row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
    .row > input { margin: 0; }

    /* Buttons: one primary per screen */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 44px; padding: 0 1.1rem; border: 1px solid var(--line-2); background: transparent; color: var(--ink); font: 600 12px var(--sans); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease); }
    .btn:hover { border-color: var(--ink); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn.primary { border-color: var(--amber); }
    .btn.primary:hover { background: var(--amber); color: var(--amber-ink); }
    .btn.sm { min-height: 32px; padding: 0 .7rem; font-size: 11px; letter-spacing: .14em; }
    .btn.quiet { border-color: transparent; color: var(--mute); padding: 0 .4rem; }
    .btn.quiet:hover { color: var(--ink); }

    /* Tool picker: index rows */
    .index { border-top: 1px solid var(--line); margin: 0 0 2rem; }
    .index-row { display: grid; grid-template-columns: 180px 1fr 160px 20px; gap: 1.25rem; align-items: baseline; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 1.15rem 0; text-align: left; cursor: pointer; color: var(--ink); }
    .index-row .name { font-weight: 800; font-variation-settings: "wdth" 125; text-transform: uppercase; font-size: 22px; line-height: 1; letter-spacing: .01em; transition: color .2s var(--ease); }
    .index-row .desc { color: var(--mute); }
    .index-row .desc b { display: block; color: var(--ink); font-weight: 600; margin-bottom: .15rem; }
    .index-row .out { font: 500 12px var(--mono); color: var(--dim); }
    .index-row .arw { color: var(--dim); transition: transform .2s var(--ease), color .2s var(--ease); }
    .index-row:hover .name, .index-row.on .name { color: var(--amber); }
    .index-row:hover .arw { transform: translateX(4px); color: var(--amber); }

    /* Settings: hairline sections */
    .sec { border-top: 1px solid var(--line); padding: 1.25rem 0 .4rem; display: grid; grid-template-columns: 180px 1fr; gap: 1.25rem; }
    .sec > h3 { margin: 0; font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--mute); padding-top: .3rem; }
    .opts { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); margin: 0 0 1rem; width: fit-content; max-width: 100%; }
    .opt { background: none; border: 0; border-right: 1px solid var(--line); padding: .6rem .9rem; cursor: pointer; text-align: left; color: var(--mute); min-width: 92px; transition: color .2s var(--ease), background .2s var(--ease); }
    .opt:last-child { border-right: 0; }
    .opt:hover { color: var(--ink); }
    .opt.on { color: var(--ink); background: rgba(255,200,61,.08); box-shadow: inset 0 -2px 0 var(--amber); }
    .opt small { display: block; font: 500 11px var(--mono); color: var(--dim); margin-top: .15rem; }

    .picked { display: flex; align-items: baseline; gap: 1rem; margin: 0 0 1.4rem; }
    .picked .name { font-weight: 800; font-variation-settings: "wdth" 125; text-transform: uppercase; font-size: clamp(30px, 3.6vw, 52px); line-height: .9; }
    .why { list-style: none; padding: 0; margin: 0 0 1rem; }
    .why li { color: var(--mute); padding: .3rem 0 .3rem 1rem; border-left: 1px solid var(--amber); margin-bottom: .3rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; border-top: 1px solid var(--line); padding-top: 1.25rem; margin-top: .6rem; }
    .actions .spacer { flex: 1; }

    /* Library rows */
    .runs { border-top: 1px solid var(--line); }
    .run-row { display: grid; grid-template-columns: 72px 1fr 110px 90px; gap: 1rem; align-items: center; padding: .8rem 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .run-row img, .run-row .ph { width: 72px; height: 72px; object-fit: cover; background: var(--panel); display: block; }
    .run-row h3 { margin: 0 0 .15rem; font-size: 15px; font-weight: 600; transition: color .2s var(--ease); }
    .run-row p { margin: 0; color: var(--dim); font-size: 13px; }
    .run-row:hover h3 { color: var(--amber); }
    .tag { font: 600 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
    .score { font: 500 13px var(--mono); color: var(--ink); text-align: right; }

    /* Run detail */
    .files { border-top: 1px solid var(--line); margin: 0 0 1.5rem; }
    .files a { display: flex; justify-content: space-between; padding: .7rem 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
    .files a:hover { color: var(--amber); }
    .files a span { font: 500 12px var(--mono); color: var(--dim); }
    .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1.5rem 1.25rem; }
    .clip video { width: 100%; aspect-ratio: 9/16; object-fit: contain; background: #000; display: block; border: 1px solid var(--line); }
    .clip.wide video { aspect-ratio: 16/9; }
    .clip h3 { margin: .7rem 0 .15rem; font-size: 14px; font-weight: 600; }
    .clip .ttl { display: block; width: 100%; margin: .7rem 0 .15rem; padding: .2rem 0; background: none; border: 0; border-bottom: 1px solid transparent; font: 600 15px/1.3 var(--sans); color: var(--ink); height: auto; resize: none; overflow: hidden; }
    .clip .ttl:hover { border-bottom-color: var(--line-2); }
    .clip .ttl:focus { border-bottom-color: var(--amber); outline: none; }
    .clip p { margin: 0 0 .5rem; color: var(--dim); font: 500 12px var(--mono); }
    .clip .row { gap: .3rem; }
    .clip input { width: 88px; height: 32px; padding: 0 .5rem; font-size: 12px; margin: 0; }
    .copy { border-left: 2px solid var(--amber); padding: .2rem 0 .2rem 1rem; margin: 0 0 1.5rem; }
    .copy ul { margin: 0 0 .6rem; padding-left: 1.1rem; }
    pre.tx { white-space: pre-wrap; font: 14px/1.6 var(--sans); color: var(--mute); background: var(--panel); border: 1px solid var(--line); padding: 1rem 1.2rem; max-height: 420px; overflow: auto; margin: 0 0 1.5rem; }

    /* Jobs */
    .job { border-bottom: 1px solid var(--line); padding: 1rem 0; }
    .job:first-of-type { border-top: 1px solid var(--line); }
    .job .head { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
    .job strong { font-weight: 600; }
    .st { font: 500 12px var(--mono); color: var(--dim); white-space: nowrap; }
    .st.running { color: var(--ember); }
    .st.failed { color: var(--bad); }
    .bar { height: 2px; background: var(--line); margin: .7rem 0 0; }
    .bar > i { display: block; height: 2px; background: var(--amber); transition: width .6s var(--ease); }
    .empty { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 2.5rem 0; color: var(--mute); }

    @media (max-width: 860px) {
      #app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
      .top { flex-wrap: wrap; height: auto; padding: .8rem 1rem; gap: .7rem; }
      .search { order: 3; max-width: none; flex-basis: 100%; }
      aside { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); padding: 0; overflow-x: auto; gap: 0; }
      .rail-h, .rail-foot, .rail.tools-rail { display: none; }
      .rail { display: flex; }
      .rail button { border-left: 0; border-bottom: 2px solid transparent; padding: .8rem 1rem; }
      .rail button.on { border-bottom-color: var(--amber); }
      .index-row { grid-template-columns: 1fr 20px; }
      .index-row .desc { grid-column: 1; }
      .index-row .out { display: none; }
      .sec { grid-template-columns: 1fr; gap: .5rem; }
      .run-row { grid-template-columns: 56px 1fr 60px; }
      .run-row img, .run-row .ph { width: 56px; height: 56px; }
      .run-row .tag { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="app">
    <header class="top">
      <span class="word" data-t="Hermes Studio">Hermes <b>Studio</b></span>
      <div class="search"><input id="q" placeholder="Search runs, titles, sources" aria-label="Search library" /></div>
      <div class="top-meta"><span id="top-live" class="run" hidden></span><span>Local · never posts</span></div>
    </header>
    <aside>
      <div>
        <p class="rail-h">Desk</p>
        <nav class="rail" id="pages">
          <button data-page="create" class="on"><span class="nm">New</span></button>
          <button data-page="library"><span class="nm">Library</span><span class="ct" id="lib-ct"></span></button>
          <button data-page="jobs"><span class="nm">Jobs</span><span class="ct" id="job-ct"></span></button>
        </nav>
      </div>
      <div>
        <p class="rail-h">Tools</p>
        <nav class="rail tools-rail" id="tool-rail"></nav>
      </div>
      <p class="rail-foot">Whisper and FFmpeg on this machine. Files stay here. You post.</p>
    </aside>
    <main id="main"><div class="wrap"></div></main>
  </div>
  <script>
    const FALLBACK_TOOLS = [
      { id: "clip", name: "Clips", verb: "Find the moments", line: "Long video in. Hook-first shorts out, scored and captioned.", output: "3–8 short clips", defaults: { aspect: "9:16", layout: "fit", captions: true, hook: true, pacing: "tight" }, settings: ["hunt","range","format","length","captions"] },
      { id: "captions", name: "Captions", verb: "Caption the whole take", line: "Word-by-word captions on the full video. No cutting.", output: "1 captioned video", defaults: { aspect: "9:16", layout: "fit", captions: true, hook: false, pacing: "natural" }, settings: ["range","format","captions"] },
      { id: "reframe", name: "Reframe", verb: "Change the shape", line: "16:9 to 9:16, 4:5 or 1:1.", output: "1 reshaped video", defaults: { aspect: "9:16", layout: "fill", captions: false, hook: false, pacing: "natural" }, settings: ["range","format","captions"] },
      { id: "tighten", name: "Tighten", verb: "Cut the dead air", line: "Drops ums and long pauses.", output: "1 tighter video", defaults: { aspect: "source", layout: "fit", captions: false, hook: false, pacing: "tight" }, settings: ["range","format","captions"] },
      { id: "transcript", name: "Transcript", verb: "Get the words", line: "SRT, VTT and text.", output: ".srt · .vtt · .txt", defaults: { captions: false, hook: false }, settings: ["range","quality"] },
    ];
    const FALLBACK_QUALITY = [
      { id: "fast", name: "Fast", line: "Quickest" }, { id: "balanced", name: "Balanced", line: "Accents, noise" }, { id: "accurate", name: "Accurate", line: "Best words" },
    ];
    const DUR = [
      { id: "xshort", label: "Extra short", hint: "10–30s", min: 10, max: 30 },
      { id: "short", label: "Short", hint: "30–60s", min: 30, max: 60 },
      { id: "medium", label: "Medium", hint: "1–2m", min: 60, max: 120 },
      { id: "long", label: "Long", hint: "2–5m", min: 120, max: 300 },
      { id: "midform", label: "Mid-form", hint: "3–15m", min: 180, max: 900 },
    ];
    const ASPECTS = [
      { v: "9:16", l: "Vertical", h: "Shorts · Reels · TikTok" },
      { v: "4:5", l: "Portrait", h: "Instagram feed" },
      { v: "1:1", l: "Square", h: "Feed" },
      { v: "16:9", l: "Horizontal", h: "YouTube · X" },
    ];
    const STYLES = ["pop", "impact", "clean", "glow", "neon", "boxed"];
    const TOOL_LABEL = { clip: "Clips", captions: "Captions", reframe: "Reframe", tighten: "Tighten", transcript: "Transcript" };

    const state = {
      page: "create", tool: null, tools: FALLBACK_TOOLS, quality: FALLBACK_QUALITY,
      src: "", probe: null, err: "",
      aspect: "9:16", layout: "fit", max_clips: 3, dur: "short",
      style: "pop", captions: true, pacing: "tight", whisper: "fast",
      live_seconds: 1200, live_from_start: false, trim: false, start: "", end: "",
      prompt: "", q: "", hook: true, why: [], keywords: "", picked: false,
      jobs: [], library: [], open: null, copy: null, trash: [], tx: null,
    };
    const $ = (s, el = document) => el.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const slugify = (t) => String(t || "clip").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "clip";
    const fmt = (n) => { if (!n && n !== 0) return ""; const s = Math.floor(n % 60).toString().padStart(2, "0"); return Math.floor(n / 60) + ":" + s; };
    const toolById = (id) => state.tools.find(t => t.id === id);
    async function api(path, opts) {
      const res = await fetch(path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.error || res.statusText);
      return data;
    }

    async function loadTools() {
      try { const d = await api("/api/tools"); if (d.tools && d.tools.length) state.tools = d.tools; if (d.quality) state.quality = d.quality; } catch {}
      renderRail(); render();
    }
    function renderRail() {
      $("#tool-rail").innerHTML = state.tools.map(t => `<button data-tool="${t.id}" class="${state.page==="create"&&state.tool===t.id?"on":""}"><span class="nm">${esc(t.name)}</span></button>`).join("");
      document.querySelectorAll("#tool-rail [data-tool]").forEach(b => b.onclick = () => pickTool(b.dataset.tool));
      document.querySelectorAll("#pages [data-page]").forEach(b => b.classList.toggle("on", b.dataset.page === state.page && !(state.page === "create" && state.tool)));
    }
    function pickTool(id) {
      grabForm();
      const t = toolById(id); if (!t) return;
      state.tool = id; state.page = "create"; state.open = null; state.err = ""; state.why = []; state.picked = false;
      Object.assign(state, t.defaults || {});
      renderRail(); render();
    }

    async function refresh() {
      try {
        const jobs = await api("/api/jobs"); state.jobs = jobs.jobs || [];
        const lib = await api("/api/library"); state.library = lib.runs || [];
      } catch { return; }
      const live = state.jobs.filter(j => j.status === "queued" || j.status === "running").length;
      $("#job-ct").textContent = live ? live + " live" : (state.jobs.length || "");
      $("#job-ct").classList.toggle("live", !!live);
      $("#lib-ct").textContent = state.library.length || "";
      const running = state.jobs.filter(j => j.status === "running").length, queued = live - running;
      const tl = $("#top-live"); tl.textContent = [running ? running + " running" : "", queued ? queued + " queued" : ""].filter(Boolean).join(" · "); tl.hidden = !live;
      if (state.page === "create") return;
      if (state.page === "library" && state.open) return;
      const sig = JSON.stringify([state.page, state.q, state.jobs.map(j => [j.id, j.status, j.progress, j.message]), state.library.length]);
      if (sig === state.sig) return;
      state.sig = sig; render();
    }
    function nav(page) {
      grabForm();
      state.page = page; state.open = null; state.tx = null;
      if (page === "create") state.tool = null;
      renderRail(); render();
    }
    document.querySelectorAll("#pages [data-page]").forEach(b => b.addEventListener("click", () => nav(b.dataset.page)));

    function render() {
      const main = $("#main .wrap");
      main.innerHTML = state.page === "create" ? createPage() : state.page === "library" ? libraryPage() : jobsPage();
      bind();
    }

    /* ---------- Create ---------- */
    function createPage() {
      if (!state.tool) return toolPicker();
      const t = toolById(state.tool);
      const on = (k) => (t.settings || []).includes(k);
      return `<p class="kicker"><a href="#" id="all-tools">All tools</a></p>
        <div class="picked"><span class="name">${esc(t.name)}</span><span class="hint">${esc(t.output)}</span></div>
        <p class="lede">${esc(t.line)}</p>
        ${state.err ? `<p class="err">${esc(state.err)}</p>` : ""}
        ${sourceSec()}
        ${state.why.length ? `<section class="sec"><h3>Hermes pick</h3><div><ul class="why">${state.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div></section>` : ""}
        ${on("hunt") ? huntSec() : ""}
        ${on("range") ? rangeSec() : ""}
        ${on("format") ? formatSec(t) : ""}
        ${on("length") ? lengthSec() : ""}
        ${on("captions") ? captionSec(t) : ""}
        ${qualitySec()}
        <div class="actions">
          ${t.id === "clip" ? `<button class="btn" id="best-btn">Let Hermes pick</button>` : ""}
          <span class="spacer"></span>
          <span class="hint">${summary(t)}</span>
          <button class="btn primary" id="run-btn">Run ${esc(t.name)}</button>
        </div>`;
    }
    function toolPicker() {
      return `<p class="kicker">New run</p><h1>Pick a tool.</h1>
        <p class="lede">Each tool is one job on your video. Everything runs on this machine, and nothing is posted.</p>
        <div class="index">${state.tools.map(t => `<button class="index-row" data-tool="${t.id}">
          <span class="name">${esc(t.name)}</span>
          <span class="desc"><b>${esc(t.verb)}</b>${esc(t.line)}</span>
          <span class="out">${esc(t.output)}</span><span class="arw" aria-hidden="true">→</span></button>`).join("")}</div>`;
    }
    function sourceSec() {
      const p = state.probe;
      const probeLine = p ? (p.ok ? `<span class="ok">${esc(p.title)}</span>${p.duration ? ` <span class="mono">${fmt(p.duration)}</span>` : ""}${p.is_live ? ` <span class="mono" style="color:var(--ember)">LIVE</span>` : ""}` : `<span style="color:var(--bad)">${esc(p.error)}</span>`) : "File path, YouTube, X, Twitch or a livestream.";
      return `<section class="sec"><h3>Source</h3><div>
        <div class="row" style="flex-wrap:nowrap"><input id="src" value="${esc(state.src)}" placeholder="https://youtube.com/…  or  /path/to/video.mp4" /><button class="btn" id="probe-btn" style="margin-bottom:1rem">Check</button></div>
        <p class="hint" style="margin:-.4rem 0 1rem">${probeLine}</p></div></section>`;
    }
    function huntSec() {
      return `<section class="sec"><h3>Hunt</h3><div>
        <input id="prompt" value="${esc(state.prompt)}" placeholder="Optional. Words to hunt for: money, mistake, wait what" />
        </div></section>`;
    }
    function rangeSec() {
      return `<section class="sec"><h3>Range</h3><div>
        <label class="check"><input type="checkbox" id="trim" ${state.trim ? "checked" : ""}> Only part of the video</label>
        ${state.trim ? `<div class="row" style="margin-bottom:1rem"><input id="start" placeholder="start · 90 or 1:30" value="${esc(state.start)}" style="max-width:180px"><input id="end" placeholder="end" value="${esc(state.end)}" style="max-width:180px"></div>` : ""}
        <label class="f">If it's live, record</label>
        <div class="opts">${[[600,"10 min"],[1200,"20 min"],[1800,"30 min"],[3600,"60 min"]].map(([v,l]) => `<button class="opt ${state.live_seconds==v?"on":""}" data-k="live_seconds" data-v="${v}" data-n="1">${l}</button>`).join("")}</div>
        <label class="check"><input type="checkbox" id="live_from_start" ${state.live_from_start ? "checked" : ""}> YouTube live from the start</label>
        </div></section>`;
    }
    function formatSec(t) {
      const aspects = t.id === "tighten" ? [{ v: "source", l: "Keep", h: "Source frame" }, ...ASPECTS] : ASPECTS;
      return `<section class="sec"><h3>Format</h3><div>
        <div class="opts">${aspects.map(a => `<button class="opt ${state.aspect===a.v?"on":""}" data-k="aspect" data-v="${a.v}">${a.l}<small>${a.v === "source" ? a.h : a.v}</small></button>`).join("")}</div>
        ${state.aspect !== "source" ? `<label class="f">Framing</label>
        <div class="opts"><button class="opt ${state.layout==="fit"?"on":""}" data-k="layout" data-v="fit">Classic<small>whole frame · blur pad</small></button><button class="opt ${state.layout==="fill"?"on":""}" data-k="layout" data-v="fill">Speaker<small>punch in on the face</small></button></div>` : ""}
        </div></section>`;
    }
    function lengthSec() {
      return `<section class="sec"><h3>Length</h3><div>
        <div class="opts">${DUR.map(d => `<button class="opt ${state.dur===d.id?"on":""}" data-k="dur" data-v="${d.id}">${d.label}<small>${d.hint}</small></button>`).join("")}</div>
        <label class="f">How many</label>
        <div class="opts">${[3,5,8].map(n => `<button class="opt ${state.max_clips==n?"on":""}" data-k="max_clips" data-v="${n}" data-n="1">${n}</button>`).join("")}</div>
        <label class="f">Pacing</label>
        <div class="opts"><button class="opt ${state.pacing==="tight"?"on":""}" data-k="pacing" data-v="tight">Tight<small>cut filler</small></button><button class="opt ${state.pacing==="natural"?"on":""}" data-k="pacing" data-v="natural">Natural<small>as spoken</small></button></div>
        </div></section>`;
    }
    function captionSec(t) {
      return `<section class="sec"><h3>Captions</h3><div>
        <label class="check"><input type="checkbox" id="captions" ${state.captions ? "checked" : ""}> Burn word-by-word captions</label>
        ${state.captions ? `<div class="opts">${STYLES.map(s => `<button class="opt ${state.style===s?"on":""}" data-k="style" data-v="${s}">${s}</button>`).join("")}</div>
        <input id="keywords" placeholder="Highlight words: money, mistake, never" value="${esc(state.keywords || "")}" />` : ""}
        ${t.id === "clip" ? `<label class="check"><input type="checkbox" id="hook" ${state.hook ? "checked" : ""}> Hook title for the first 3 seconds</label>` : ""}
        </div></section>`;
    }
    function qualitySec() {
      return `<section class="sec"><h3>Transcription</h3><div>
        <div class="opts">${state.quality.map(q => `<button class="opt ${state.whisper===q.id?"on":""}" data-k="whisper" data-v="${q.id}">${esc(q.name)}<small>${esc(q.model || q.line)}</small></button>`).join("")}</div>
        </div></section>`;
    }
    function summary(t) {
      const d = DUR.find(x => x.id === state.dur);
      const bits = [];
      if (t.settings.includes("format")) bits.push(state.aspect === "source" ? "source frame" : state.aspect);
      if (t.settings.includes("length")) bits.push(`${state.max_clips} × ${d ? d.hint : ""}`);
      if (t.settings.includes("captions")) bits.push(state.captions ? state.style : "no captions");
      bits.push(state.whisper);
      return esc(bits.join(" · "));
    }

    /* ---------- Library ---------- */
    function viral(j) {
      const scores = (j.clips || []).map(c => (c.virality != null ? c.virality : Math.round((c.score || 0) * 100)));
      return scores.length ? Math.max(...scores) : 0;
    }
    function libraryPage() {
      if (state.open) return runDetail(state.open);
      const q = (state.q || "").trim().toLowerCase();
      let runs = state.library.slice();
      if (q) runs = runs.filter(j => (j.title || "").toLowerCase().includes(q) || (j.src || "").toLowerCase().includes(q));
      if (!runs.length) return `<p class="kicker">Library</p><h1>${q ? "No match." : "Nothing yet."}</h1><div class="empty">${q ? "Try another word." : "Finished runs land here, newest first."}</div>`;
      return `<p class="kicker">Library</p><h1>${runs.length} run${runs.length === 1 ? "" : "s"}.</h1>
        <div class="runs">${runs.map(j => {
          const thumb = (j.clips || []).find(c => c.thumb);
          const v = viral(j);
          const n = (j.clips || []).length, f = (j.files || []).length;
          return `<div class="run-row" data-open="${j.id}" role="button" tabindex="0">
            ${thumb ? `<img src="/media/${j.id}/${thumb.thumb}" alt="">` : `<div class="ph"></div>`}
            <div><h3>${esc(j.title || j.id)}</h3><p>${n ? n + " video" + (n === 1 ? "" : "s") : ""}${n && f ? " · " : ""}${f ? f + " files" : ""}${j.is_live ? " · live" : ""}</p></div>
            <span class="tag">${esc(TOOL_LABEL[j.mode] || "Clips")}</span>
            <span class="score">${j.mode === "clip" && v ? v : ""}</span></div>`;
        }).join("")}</div>`;
    }
    function runDetail(j) {
      const copy = state.copy && state.copy.job === j.id ? state.copy : null;
      const wide = j.aspect === "16:9" || j.aspect === "source";
      const files = j.files || [];
      return `<p class="kicker"><a href="#" id="back-lib">Library</a> · ${esc(TOOL_LABEL[j.mode] || "Clips")}</p>
        <h1>${esc(j.title)}</h1>
        <p class="lede mono">${esc(j.src)}</p>
        ${state.err ? `<p class="err">${esc(state.err)}</p>` : ""}
        ${files.length ? `<div class="files">${files.map(f => `<a href="/media/${j.id}/${encodeURIComponent(f.file)}" download>${esc(f.label || f.file)}<span>${esc(f.file)}</span></a>`).join("")}</div>` : ""}
        ${j.mode === "transcript" ? `<pre class="tx">${esc(state.tx || "Loading transcript…")}</pre>` : ""}
        ${(j.clips || []).length ? `<div class="row" style="margin:0 0 1.25rem"><button class="btn" id="name-btn" data-job="${j.id}">AI name clips</button><button class="btn" id="copy-btn" data-job="${j.id}">Write social copy</button><span class="hint">${state.nameSrc ? "Named by " + esc(state.nameSrc) + ". Click a name to edit." : "Names come from each clip's words. Click a name to edit."}</span></div>` : ""}
        ${copy ? `<div class="copy"><p class="kicker">${esc(copy.source || "copy")}</p><ul>${(copy.titles || []).map(t => `<li>${esc(t)}</li>`).join("")}</ul><p class="lede" style="margin:0 0 .4rem">${esc(copy.description || "")}</p><p class="hint mono">${esc((copy.hashtags || []).join(" "))}</p></div>` : ""}
        <div class="clips">${(j.clips || []).map(c => `<article class="clip ${wide ? "wide" : ""}">
          <video controls playsinline preload="none" poster="${c.thumb ? `/media/${j.id}/${c.thumb}` : ""}" src="/media/${j.id}/${c.file}"></video>
          <a class="hint mono" style="float:right;margin-top:.8rem;text-decoration:none" href="/media/${j.id}/${c.file}" download="${esc(slugify(c.title || c.file))}.mp4">Save ↓</a>
          <textarea class="ttl" rows="2" data-title="${esc(c.file)}" aria-label="Clip name" maxlength="90">${esc(c.title || c.file)}</textarea>
          <p>${fmt(c.start)}–${fmt(c.end)}${c.virality ? " · " + c.virality : ""}${c.saved ? " · " + c.saved + "s cut" : ""}</p>
          <div class="row">
            <button class="btn sm" data-up="${esc(c.file)}" aria-label="Move up">↑</button>
            <button class="btn sm" data-down="${esc(c.file)}" aria-label="Move down">↓</button>
            <input data-split-at="${esc(c.file)}" placeholder="split s" />
            <button class="btn sm" data-split="${esc(c.file)}">Split</button>
            <button class="btn sm" data-dup="${esc(c.file)}">Copy</button>
            <button class="btn sm quiet" data-drop="${esc(c.file)}">Drop</button>
          </div></article>`).join("")}</div>
        ${(state.trash || []).length ? `<p class="kicker" style="margin-top:2rem">Dropped</p><div class="row">${state.trash.map(t => `<button class="btn sm" data-restore="${esc(t.file)}">Restore ${esc(t.file)}</button>`).join("")}</div>` : ""}`;
    }

    /* ---------- Jobs ---------- */
    function jobsPage() {
      const jobs = state.jobs;
      if (!jobs.length) return `<p class="kicker">Jobs</p><h1>Quiet.</h1><div class="empty">Nothing running. Pick a tool to start.</div>`;
      return `<p class="kicker">Jobs</p><h1>Queue and history.</h1><p class="lede">Two jobs run at once. The rest wait their turn.</p>${jobs.map(j => {
        const pct = Math.round((j.progress || 0) * 100);
        const retry = (j.status === "failed" || j.status === "cancelled") ? `<button class="btn sm" data-retry="${j.id}">Retry</button>` : "";
        const cancel = j.status === "queued" ? `<button class="btn sm" data-cancel="${j.id}">Cancel</button>` : "";
        const done = j.status === "completed" ? `<button class="btn sm" data-view="${j.id}">Open</button>` : "";
        return `<article class="job"><div class="head"><strong>${esc(j.title || j.id)}</strong><span class="st ${esc(j.status)}">${esc(TOOL_LABEL[j.mode] || "Clips")} · ${esc(j.status)}${j.stage && j.stage !== "done" ? " · " + esc(j.stage) : ""}</span></div>
          <p class="hint" style="margin:.3rem 0 0">${esc(j.message || j.error || j.src)}</p>
          ${j.status === "running" || j.status === "queued" ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}
          ${retry || cancel || done ? `<div class="row" style="margin-top:.6rem">${done}${retry}${cancel}</div>` : ""}</article>`;
      }).join("")}`;
    }

    /* ---------- Wiring ---------- */
    function grabForm() {
      const v = (id) => { const el = $("#" + id); return el ? el : null; };
      if (v("src")) state.src = v("src").value.trim();
      if (v("trim")) state.trim = v("trim").checked;
      if (v("start")) state.start = v("start").value;
      if (v("end")) state.end = v("end").value;
      if (v("live_from_start")) state.live_from_start = v("live_from_start").checked;
      if (v("captions")) state.captions = v("captions").checked;
      if (v("hook")) state.hook = v("hook").checked;
      if (v("prompt")) state.prompt = v("prompt").value;
      if (v("keywords")) state.keywords = v("keywords").value;
    }
    async function openRun(id) {
      state.page = "library"; state.open = state.library.find(j => j.id === id) || null; state.tx = null; state.err = ""; state.nameSrc = "";
      renderRail();
      try { const t = await api("/api/trash?job=" + encodeURIComponent(id)); state.trash = t.files || []; } catch { state.trash = []; }
      render();
      if (state.open && state.open.mode === "transcript") {
        try { const r = await fetch(`/media/${id}/transcript.txt`); state.tx = r.ok ? await r.text() : "Transcript file missing."; } catch { state.tx = "Transcript file missing."; }
        render();
      }
    }
    function bind() {
      document.querySelectorAll("main [data-tool]").forEach(el => el.onclick = () => pickTool(el.dataset.tool));
      const all = $("#all-tools"); if (all) all.onclick = (e) => { e.preventDefault(); grabForm(); state.tool = null; renderRail(); render(); };
      document.querySelectorAll("[data-k]").forEach(el => el.onclick = () => { grabForm(); state[el.dataset.k] = el.dataset.n ? Number(el.dataset.v) : el.dataset.v; render(); });
      ["trim", "captions"].forEach(id => { const el = $("#" + id); if (el) el.onchange = () => { grabForm(); render(); }; });
      const probeBtn = $("#probe-btn");
      if (probeBtn) probeBtn.onclick = async () => {
        grabForm(); state.err = "";
        if (!state.src) { state.err = "Paste a source first."; render(); return; }
        probeBtn.disabled = true; probeBtn.textContent = "Checking…";
        try { state.probe = await api("/api/probe?src=" + encodeURIComponent(state.src)); }
        catch (e) { state.probe = { ok: false, error: e.message }; }
        render();
      };
      const bestBtn = $("#best-btn");
      if (bestBtn) bestBtn.onclick = async () => {
        grabForm(); state.err = "";
        if (!state.src) { state.err = "Paste a source first."; render(); return; }
        bestBtn.disabled = true; bestBtn.textContent = "Reading the video…";
        try {
          const data = await api("/api/recommend?src=" + encodeURIComponent(state.src));
          const r = data.recommendation || {};
          state.probe = { ok: true, title: data.title, is_live: data.is_live, duration: data.duration };
          const tool = r.mode === "captions" ? "captions" : "clip";
          state.tool = tool;
          Object.assign(state, {
            aspect: r.aspect || "9:16", layout: r.layout || "fit", dur: r.dur || "short", max_clips: r.max_clips || 3,
            pacing: r.pacing || "tight", style: r.style || "pop", captions: r.captions !== false, hook: r.hook !== false,
            live_seconds: r.live_seconds || 1200, why: r.why || [], picked: true,
          });
          if (r.prompt) state.prompt = r.prompt;
          if (r.keywords) state.keywords = r.keywords;
          renderRail();
        } catch (e) { state.err = e.message; }
        render();
      };
      const runBtn = $("#run-btn");
      if (runBtn) runBtn.onclick = async () => {
        grabForm(); state.err = "";
        if (!state.src) { state.err = "Paste a source first."; render(); return; }
        const t = toolById(state.tool);
        const d = DUR.find(x => x.id === state.dur) || DUR[1];
        runBtn.disabled = true; runBtn.textContent = "Queuing…";
        try {
          await api("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
            src: state.src, mode: t.id, layout: state.layout, aspect: state.aspect || "9:16", max_clips: state.max_clips,
            min_sec: d.min, max_sec: d.max, style: state.style, captions: t.id === "captions" ? true : state.captions,
            pacing: state.pacing, live_seconds: state.live_seconds, live_from_start: state.live_from_start,
            start_time: state.trim && state.start ? state.start : null,
            end_time: state.trim && state.end ? state.end : null,
            prompt: t.id === "clip" ? state.prompt : "", keywords: state.captions ? state.keywords : "",
            hook: t.id === "clip" ? state.hook : false,
            plan: "heuristic", whisper: state.whisper,
          })});
          state.why = [];
          nav("jobs"); await refresh();
        } catch (e) { state.err = e.message; render(); }
      };
      document.querySelectorAll("[data-open]").forEach(el => {
        el.onclick = () => openRun(el.dataset.open);
        el.onkeydown = (e) => { if (e.key === "Enter") openRun(el.dataset.open); };
      });
      document.querySelectorAll("[data-view]").forEach(el => el.onclick = async () => { await refresh(); openRun(el.dataset.view); });
      document.querySelectorAll("video").forEach(v => v.addEventListener("play", () => document.querySelectorAll("video").forEach(o => { if (o !== v) o.pause(); })));
      const backLib = $("#back-lib"); if (backLib) backLib.onclick = (e) => { e.preventDefault(); state.open = null; state.tx = null; render(); };
      const clipOp = async (file, op, extra) => {
        const jobId = state.open && state.open.id; if (!jobId) return;
        state.err = "";
        try {
          await api("/api/edit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ job: jobId, file, op, ...(extra || {}) }) });
          await refresh();
          state.open = state.library.find(x => x.id === jobId) || state.open;
          const t = await api("/api/trash?job=" + encodeURIComponent(jobId)); state.trash = t.files || [];
        } catch (e) { state.err = e.message; }
        render();
      };
      document.querySelectorAll("[data-split]").forEach(el => el.onclick = () => {
        const file = el.dataset.split;
        const inp = document.querySelector(`[data-split-at="${CSS.escape(file)}"]`);
        const at = Number(inp && inp.value);
        if (!at) { state.err = "Split needs a time in seconds."; render(); return; }
        clipOp(file, "split", { at });
      });
      document.querySelectorAll("[data-up]").forEach(el => el.onclick = () => clipOp(el.dataset.up, "reorder", { dir: "up" }));
      document.querySelectorAll("[data-down]").forEach(el => el.onclick = () => clipOp(el.dataset.down, "reorder", { dir: "down" }));
      document.querySelectorAll("[data-dup]").forEach(el => el.onclick = () => clipOp(el.dataset.dup, "duplicate"));
      document.querySelectorAll("[data-drop]").forEach(el => el.onclick = () => { if (confirm("Drop this clip? It moves to the run's .trash and can be restored.")) clipOp(el.dataset.drop, "drop"); });
      document.querySelectorAll("[data-restore]").forEach(el => el.onclick = () => clipOp(el.dataset.restore, "restore"));
      const nameBtn = $("#name-btn");
      if (nameBtn) nameBtn.onclick = async () => {
        const id = nameBtn.dataset.job;
        nameBtn.disabled = true; nameBtn.textContent = "Naming…"; state.err = "";
        try {
          const r = await api("/api/name", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ job: id }) });
          state.nameSrc = r.source;
          await refresh(); state.open = state.library.find(x => x.id === id) || state.open;
        } catch (e) { state.err = e.message; }
        render();
      };
      document.querySelectorAll("[data-title]").forEach(el => {
        const save = async () => {
          const jobId = state.open && state.open.id; const file = el.dataset.title;
          const clip = (state.open.clips || []).find(c => c.file === file);
          if (!jobId || !clip || el.value.trim() === (clip.title || "")) return;
          try {
            const r = await api("/api/rename", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ job: jobId, file, title: el.value }) });
            clip.title = r.title; el.value = r.title;
          } catch (e) { state.err = e.message; render(); }
        };
        el.onblur = save;
        el.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } if (e.key === "Escape") { const c = (state.open.clips || []).find(x => x.file === el.dataset.title); el.value = c ? c.title : el.value; el.blur(); } };
      });
      const copyBtn = $("#copy-btn");
      if (copyBtn) copyBtn.onclick = async () => {
        const id = copyBtn.dataset.job;
        copyBtn.disabled = true; copyBtn.textContent = "Writing…";
        try { const data = await api("/api/copy?job=" + encodeURIComponent(id)); state.copy = { job: id, ...data }; }
        catch (e) { state.err = e.message; }
        render();
      };
      document.querySelectorAll("[data-retry]").forEach(el => el.onclick = async () => { await api("/api/jobs/" + el.dataset.retry + "/retry", { method: "POST" }); state.sig = ""; refresh(); });
      document.querySelectorAll("[data-cancel]").forEach(el => el.onclick = async () => { await api("/api/jobs/" + el.dataset.cancel + "/cancel", { method: "POST" }); state.sig = ""; refresh(); });
    }
    $("#q").oninput = (e) => { state.q = e.target.value; if (state.page !== "library" || state.open) { state.page = "library"; state.open = null; renderRail(); } render(); };
    renderRail(); render(); loadTools(); refresh(); setInterval(refresh, 2500);
  </script>
</body>
</html>
