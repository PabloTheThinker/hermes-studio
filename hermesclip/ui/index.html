<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes Studio</title>
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Hermes Studio: house structure (Vektra v3) in Hermes colors.
       Black canvas, warm ink, hairlines, rows not cards, one accent per screen.
       Accent = Hermes amber (from the Hermes Agent wordmark), not Vektra gold.
       Ember = the wordmark's echo outline; used only for the brand echo and live state. */
    :root {
      --bg: #0b0b0c;
      --panel: #111112;
      --ink: #f2efe8;
      --mute: rgba(242,239,232,.64);
      --dim: rgba(242,239,232,.5);
      --line: rgba(242,239,232,.12);
      --line-2: rgba(242,239,232,.2);
      --amber: #ffc83d;
      --amber-ink: #110c00;
      --ember: #cd8032;
      --bad: #ff6b5b;
      --ease: cubic-bezier(.2,.7,.1,1);
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Archivo", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); font-variation-settings: "wdth" 100; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--amber); color: var(--amber-ink); }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }

    #app { display: grid; grid-template-columns: 248px 1fr; grid-template-rows: 64px 1fr; min-height: 100%; }

    /* Top bar */
    .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 1.25rem; padding: 0 1.25rem; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; }
    .word { position: relative; font-weight: 800; font-variation-settings: "wdth" 125; text-transform: uppercase; letter-spacing: .04em; font-size: 15px; line-height: 1; white-space: nowrap; }
    .word b { color: var(--amber); font-weight: 800; }
    /* the Hermes echo: one offset outline, like the Agent wordmark */
    .word::after { content: attr(data-t); position: absolute; left: 3px; top: 3px; color: transparent; -webkit-text-stroke: 1px var(--ember); opacity: .55; z-index: -1; pointer-events: none; }
    .search { flex: 1; max-width: 440px; }
    .search input { height: 36px; margin: 0; }
    .top-meta { margin-left: auto; display: flex; align-items: center; gap: 1rem; font: 500 11px var(--mono); color: var(--dim); letter-spacing: .04em; }
    .top-meta .run { color: var(--ember); }

    /* Rail */
    aside { border-right: 1px solid var(--line); padding: 1rem 0 1.5rem; display: flex; flex-direction: column; gap: 1.4rem; overflow: auto; }
    .rail-h { font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); padding: 0 1.25rem; margin: 0 0 .35rem; }
    .rail button { white-space: nowrap; display: flex; align-items: baseline; gap: .6rem; width: 100%; background: none; border: 0; border-left: 2px solid transparent; padding: .5rem 1.25rem .5rem calc(1.25rem - 2px); text-align: left; cursor: pointer; color: var(--mute); transition: color .2s var(--ease); }
    .rail button:hover { color: var(--ink); }
    .rail button.on { color: var(--ink); border-left-color: var(--amber); }
    .rail .nm { font-weight: 600; font-size: 14px; }
    .rail .ct { margin-left: auto; font: 500 11px var(--mono); color: var(--dim); }
    .rail .ct.live { color: var(--ember); }
    .rail-foot { margin-top: auto; padding: 0 1.25rem; font-size: 12px; color: var(--dim); line-height: 1.45; }

    main { padding: 2rem clamp(1.25rem, 3vw, 3rem) 4rem; overflow: auto; }
    .wrap { max-width: 980px; }

    /* Type */
    .kicker { font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin: 0 0 .6rem; }
    .kicker a { color: var(--mute); text-decoration: none; border-bottom: 1px solid var(--line-2); }
    .kicker a:hover { color: var(--ink); border-color: var(--amber); }
    h1 { font-weight: 800; font-variation-settings: "wdth" 125; text-transform: uppercase; font-size: clamp(30px, 3.6vw, 52px); line-height: .9; letter-spacing: -.01em; margin: 0 0 .8rem; text-wrap: balance; }
    h2 { font-weight: 600; font-variation-settings: "wdth" 104; font-size: 20px; letter-spacing: -.01em; margin: 0; }
    .lede { color: var(--mute); max-width: 60ch; margin: 0 0 1.6rem; text-wrap: pretty; }
    .hint { color: var(--dim); font-size: 13px; }
    .mono { font-family: var(--mono); font-size: 12px; }
    .err { color: var(--bad); white-space: pre-wrap; border-left: 2px solid var(--bad); padding: .4rem .8rem; margin: 0 0 1rem; }
    .ok { color: var(--ink); }

    /* Forms */
    label.f { display: block; font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin: 0 0 .45rem; }
    input, select { width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 0; padding: .7rem .85rem; font: 14px var(--sans); margin: 0 0 1rem; transition: border-color .2s var(--ease); }
    input:focus, select:focus { border-color: var(--amber); outline: none; }
    input::placeholder { color: var(--dim); }
    .check { display: flex; align-items: center; gap: .6rem; font-size: 14px; color: var(--mute); margin: 0 0 .8rem; cursor: pointer; }
    .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--amber); }
    .row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
    .row > input { margin: 0; }

    /* Buttons: one primary per screen */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 44px; padding: 0 1.1rem; border: 1px solid var(--line-2); background: transparent; color: var(--ink); font: 600 12px var(--sans); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease); }
    .btn:hover { border-color: var(--ink); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn.primary { border-color: var(--amber); }
    .btn.primary:hover { background: var(--amber); color: var(--amber-ink); }
    .btn.sm { min-height: 32px; padding: 0 .7rem; font-size: 11px; letter-spacing: .14em; }
    .btn.quiet { border-color: transparent; color: var(--mute); padding: 0 .4rem; }
    .btn.quiet:hover { color: var(--ink); }

    /* Tool picker: index rows */
    .index { border-top: 1px solid var(--line); margin: 0 0 2rem; }
    .index-row { display: grid; grid-template-columns: 180px 1fr 160px 20px; gap: 1.25rem; align-items: baseline; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 1.15rem 0; text-align: left; cursor: pointer; color: var(--ink); }
    .index-row .name { font-weight: 800; font-variation-settings: "wdth" 125; text-transform: uppercase; font-size: 22px; line-height: 1; letter-spacing: .01em; transition: color .2s var(--ease); }
    .index-row .desc { color: var(--mute); }
    .index-row .desc b { display: block; color: var(--ink); font-weight: 600; margin-bottom: .15rem; }
    .index-row .out { font: 500 12px var(--mono); color: var(--dim); }
    .index-row .arw { color: var(--dim); transition: transform .2s var(--ease), color .2s var(--ease); }
    .index-row:hover .name, .index-row.on .name { color: var(--amber); }
    .index-row:hover .arw { transform: translateX(4px); color: var(--amber); }

    /* Settings: hairline sections */
    .sec { border-top: 1px solid var(--line); padding: 1.25rem 0 .4rem; display: grid; grid-template-columns: 180px 1fr; gap: 1.25rem; }
    .sec > h3 { margin: 0; font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--mute); padding-top: .3rem; }
    .opts { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); margin: 0 0 1rem; width: fit-content; max-width: 100%; }
    .opt { background: none; border: 0; border-right: 1px solid var(--line); padding: .6rem .9rem; cursor: pointer; text-align: left; color: var(--mute); min-width: 92px; transition: color .2s var(--ease), background .2s var(--ease); }
    .opt:last-child { border-right: 0; }
    .opt:hover { color: var(--ink); }
    .opt.on { color: var(--ink); background: rgba(255,200,61,.08); box-shadow: inset 0 -2px 0 var(--amber); }
    .opt small { display: block; font: 500 11px var(--mono); color: var(--dim); margin-top: .15rem; }

    .picked { display: flex; align-items: baseline; gap: 1rem; margin: 0 0 1.4rem; }
    .picked .name { font-weight: 800; font-variation-settings: "wdth" 125; text-transform: uppercase; font-size: clamp(30px, 3.6vw, 52px); line-height: .9; }
    .why { list-style: none; padding: 0; margin: 0 0 1rem; }
    .why li { color: var(--mute); padding: .3rem 0 .3rem 1rem; border-left: 1px solid var(--amber); margin-bottom: .3rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; border-top: 1px solid var(--line); padding-top: 1.25rem; margin-top: .6rem; }
    .actions .spacer { flex: 1; }

    /* Library rows */
    .runs { border-top: 1px solid var(--line); }
    .run-row { display: grid; grid-template-columns: 72px 1fr 110px 90px; gap: 1rem; align-items: center; padding: .8rem 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .run-row img, .run-row .ph { width: 72px; height: 72px; object-fit: cover; background: var(--panel); display: block; }
    .run-row h3 { margin: 0 0 .15rem; font-size: 15px; font-weight: 600; transition: color .2s var(--ease); }
    .run-row p { margin: 0; color: var(--dim); font-size: 13px; }
    .run-row:hover h3 { color: var(--amber); }
    .tag { font: 600 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
    .score { font: 500 13px var(--mono); color: var(--ink); text-align: right; }

    /* Folders */
    .folders { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); width: fit-content; max-width: 100%; margin: 0 0 1.75rem; }
    .folders button { background: none; border: 0; border-right: 1px solid var(--line); padding: .65rem 1rem; cursor: pointer; color: var(--mute); font: 600 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; transition: color .2s var(--ease), background .2s var(--ease); }
    .folders button:last-child { border-right: 0; }
    .folders button:hover { color: var(--ink); }
    .folders button.on { color: var(--ink); background: rgba(255,200,61,.08); box-shadow: inset 0 -2px 0 var(--amber); }
    .folders b { font: 500 11px var(--mono); color: var(--dim); margin-left: .45rem; letter-spacing: 0; }
    .fold-h { display: flex; align-items: baseline; gap: .8rem; margin: 2rem 0 .6rem; }
    .fold-h:first-of-type { margin-top: 0; }
    .fold-h h2 { font-weight: 800; font-variation-settings: "wdth" 125; text-transform: uppercase; font-size: 22px; line-height: 1; }
    .fold-h span { font: 500 12px var(--mono); color: var(--dim); }

    /* Run detail */
    .files { border-top: 1px solid var(--line); margin: 0 0 1.5rem; }
    .files a { display: flex; justify-content: space-between; padding: .7rem 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
    .files a:hover { color: var(--amber); }
    .files a span { font: 500 12px var(--mono); color: var(--dim); }
    .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1.5rem 1.25rem; }
    .clip video { width: 100%; aspect-ratio: 9/16; object-fit: contain; background: #000; display: block; border: 1px solid var(--line); }
    .clip.wide video { aspect-ratio: 16/9; }
    .clip h3 { margin: .7rem 0 .15rem; font-size: 14px; font-weight: 600; }
    textarea.ttl { display: block; width: 100%; margin: .7rem 0 .15rem; padding: .2rem 0; background: none; border: 0; border-bottom: 1px solid transparent; border-radius: 0; font: 600 15px/1.3 var(--sans); color: var(--ink); height: auto; resize: none; overflow: hidden; box-shadow: none; }
    textarea.ttl:hover { border-bottom-color: var(--line-2); }
    textarea.ttl:focus { border-bottom-color: var(--amber); outline: none; }
    .clip p { margin: 0 0 .5rem; color: var(--dim); font: 500 12px var(--mono); }
    .clip .row { gap: .3rem; }
    .clip input { width: 88px; height: 32px; padding: 0 .5rem; font-size: 12px; margin: 0; }
    .copy { border-left: 2px solid var(--amber); padding: .2rem 0 .2rem 1rem; margin: 0 0 1.5rem; }
    .copy ul { margin: 0 0 .6rem; padding-left: 1.1rem; }
    pre.tx { white-space: pre-wrap; font: 14px/1.6 var(--sans); color: var(--mute); background: var(--panel); border: 1px solid var(--line); padding: 1rem 1.2rem; max-height: 420px; overflow: auto; margin: 0 0 1.5rem; }

    /* Jobs */
    .job { border-bottom: 1px solid var(--line); padding: 1rem 0; }
    .job:first-of-type { border-top: 1px solid var(--line); }
    .job .head { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
    .job strong { font-weight: 600; }
    .st { font: 500 12px var(--mono); color: var(--dim); white-space: nowrap; }
    .st.running { color: var(--ember); }
    .st.failed { color: var(--bad); }
    .bar { height: 2px; background: var(--line); margin: .7rem 0 0; }
    .bar > i { display: block; height: 2px; background: var(--amber); transition: width .6s var(--ease); }
    .empty { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 2.5rem 0; color: var(--mute); }


    /* ---------- Clips page (Opus-style) ---------- */
    .drop { border: 1px solid var(--line-2); background: var(--panel); padding: 1.1rem; margin: 0 0 1rem; }
    .drop .row { flex-wrap: nowrap; }
    .drop input { margin: 0; height: 52px; font-size: 16px; background: var(--bg); }
    .drop .btn.primary { min-height: 52px; white-space: nowrap; }
    .drop .probe { margin: .7rem 0 0; }
    .setbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; border: 1px solid var(--line); margin: 0 0 .8rem; }
    .setbar > div { padding: .8rem 1rem; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
    .setbar label.f { margin-bottom: .45rem; }
    .setbar select, .setbar input { margin: 0; height: 38px; padding: 0 .6rem; background: var(--bg); }
    .setbar .opts { margin: 0; }
    .setbar .opt { min-width: 0; padding: .45rem .6rem; font-size: 13px; }
    .more { background: none; border: 0; color: var(--mute); cursor: pointer; font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; padding: .4rem 0; }
    .more:hover { color: var(--ink); }
    .proj-h { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 2.6rem 0 1rem; border-bottom: 1px solid var(--line); padding-bottom: .6rem; }
    .proj-h h2 { font-weight: 800; font-variation-settings: "wdth" 125; text-transform: uppercase; font-size: 22px; }
    .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.5rem 1.25rem; }
    .proj { cursor: pointer; }
    .proj .cover { position: relative; aspect-ratio: 16/10; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
    .proj .cover img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .9; transition: opacity .2s var(--ease), transform .4s var(--ease); }
    .proj:hover .cover img { opacity: 1; transform: scale(1.02); }
    .proj .badge { position: absolute; left: .5rem; top: .5rem; background: rgba(11,11,12,.85); padding: .2rem .45rem; font: 600 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
    .proj .best { position: absolute; right: .5rem; bottom: .5rem; background: rgba(11,11,12,.85); padding: .2rem .45rem; font: 500 12px var(--mono); color: var(--amber); }
    .proj h3 { margin: .7rem 0 .2rem; font-size: 15px; font-weight: 600; line-height: 1.3; transition: color .2s var(--ease); }
    .proj:hover h3 { color: var(--amber); }
    .proj p { margin: 0; color: var(--dim); font-size: 13px; }
    .proj .bar { margin-top: .5rem; }

    .ptool { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 1.2rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: .7rem 0; margin: 0 0 1.5rem; }
    .ptool .opts { margin: 0; }
    .ptool .opt { min-width: 0; padding: .45rem .75rem; font-size: 13px; }
    .ptool .spacer { flex: 1; }
    .clist { display: flex; flex-direction: column; }
    .crow { display: grid; grid-template-columns: 34px 240px 1fr; gap: 1.5rem; padding: 1.5rem 0; border-bottom: 1px solid var(--line); }
    .crow:first-child { padding-top: 0; }
    .crow .rank { font: 500 13px var(--mono); color: var(--dim); padding-top: .2rem; }
    .crow video { width: 100%; aspect-ratio: 9/16; object-fit: contain; background: #000; border: 1px solid var(--line); display: block; }
    .crow.wide video { aspect-ratio: 16/9; }
    .crow textarea.ttl { margin-top: 0; font-size: 21px; line-height: 1.2; font-variation-settings: "wdth" 104; }
    .crow .meta { font: 500 12px var(--mono); color: var(--dim); margin: .2rem 0 1rem; }
    .vscore { display: flex; align-items: flex-end; gap: 1.75rem; margin: 0 0 1rem; }
    .vscore .big { font-weight: 800; font-variation-settings: "wdth" 125; font-size: 44px; line-height: .85; color: var(--amber); }
    .vscore .big small { font: 500 12px var(--mono); color: var(--dim); margin-left: .2rem; }
    .parts { display: grid; grid-template-columns: repeat(3, minmax(80px, 120px)); gap: 1.4rem; }
    .parts div { font: 600 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
    .parts i { display: block; height: 2px; background: var(--line); margin-top: .35rem; position: relative; }
    .parts i b { position: absolute; left: 0; top: 0; height: 2px; background: var(--ink); }
    .parts span { margin-left: .5rem; float: right; font: 500 11px var(--mono); color: var(--mute); letter-spacing: 0; }
    .words { color: var(--mute); font-size: 14px; line-height: 1.6; max-width: 62ch; margin: 0 0 1rem; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .words.open { -webkit-line-clamp: unset; }
    .cact { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
    .cact input { width: 84px; height: 32px; padding: 0 .5rem; font-size: 12px; margin: 0; }
    .btn.on { border-color: var(--amber); color: var(--amber); }
    .editp { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: 1rem; }
    .editp .setbar { margin-bottom: .8rem; }
    .editp input[type=range], .setbar input[type=range] { width: 100%; accent-color: var(--amber); height: auto; padding: 0; border: 0; background: none; }
    .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.8rem 1.25rem; }
    .cgrid .ccard video { width: 100%; aspect-ratio: 9/16; object-fit: contain; background: #000; border: 1px solid var(--line); display: block; }
    .cgrid .ccard.wide video { aspect-ratio: 16/9; }
    .cgrid .ccard .top { display: flex; justify-content: space-between; align-items: baseline; margin-top: .6rem; }
    .cgrid .ccard .top b { font: 500 13px var(--mono); color: var(--amber); }
    .cgrid .ccard textarea.ttl { margin: .2rem 0 .5rem; }
    @media (max-width: 860px) {
      .drop .row { flex-wrap: wrap; }
      .crow { grid-template-columns: 1fr; gap: .8rem; }
      .crow .rank { display: none; }
      .crow video { max-width: 280px; }
    }
    @media (max-width: 860px) {
      #app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
      .top { flex-wrap: wrap; height: auto; padding: .8rem 1rem; gap: .7rem; }
      .search { order: 3; max-width: none; flex-basis: 100%; }
      aside { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); padding: 0; overflow-x: auto; gap: 0; }
      .rail-h, .rail-foot, .rail.tools-rail { display: none; }
      .rail { display: flex; }
      .rail button { border-left: 0; border-bottom: 2px solid transparent; padding: .8rem 1rem; }
      .rail button.on { border-bottom-color: var(--amber); }
      .index-row { grid-template-columns: 1fr 20px; }
      .index-row .desc { grid-column: 1; }
      .index-row .out { display: none; }
      .sec { grid-template-columns: 1fr; gap: .5rem; }
      .run-row { grid-template-columns: 56px 1fr 60px; }
      .run-row img, .run-row .ph { width: 56px; height: 56px; }
      .run-row .tag { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="app">
    <header class="top">
      <span class="word" data-t="Hermes Studio">Hermes <b>Studio</b></span>
      <div class="search"><input id="q" placeholder="Search runs, titles, sources" aria-label="Search library" /></div>
      <div class="top-meta"><span id="top-live" class="run" hidden></span><span>Local · never posts</span></div>
    </header>
    <aside>
      <div>
        <p class="rail-h">Desk</p>
        <nav class="rail" id="pages">
          <button data-page="clips" class="on"><span class="nm">Clips</span><span class="ct" id="clip-ct"></span></button>
          <button data-page="create"><span class="nm">Other tools</span></button>
          <button data-page="library"><span class="nm">Library</span><span class="ct" id="lib-ct"></span></button>
          <button data-page="jobs"><span class="nm">Jobs</span><span class="ct" id="job-ct"></span></button>
        </nav>
      </div>
      <div>
        <p class="rail-h">Tools</p>
        <nav class="rail tools-rail" id="tool-rail"></nav>
      </div>

  </div>
  <script>
    const FALLBACK_TOOLS = [

      { id: "captions", name: "Captions", verb: "Caption the whole take", line: "Word-by-word captions on the full video. No cutting.", output: "1 captioned video", defaults: { aspect: "9:16", layout: "fit", captions: true, hook: false, pacing: "natural" }, settings: ["range","format","captions"] },
      { id: "reframe", name: "Reframe", verb: "Change the shape", line: "16:9 to 9:16, 4:5 or 1:1.", output: "1 reshaped video", defaults: { aspect: "9:16", layout: "auto", captions: false, hook: false, pacing: "natural" }, settings: ["range","format","captions"] },
      { id: "tighten", name: "Tighten", verb: "Cut the dead air", line: "Drops ums and long pauses.", output: "1 tighter video", defaults: { aspect: "source", layout: "fit", captions: false, hook: false, pacing: "tight" }, settings: ["range","format","captions"] },
      { id: "transcript", name: "Transcript", verb: "Get the words", line: "SRT, VTT and text.", output: ".srt · .vtt · .txt", defaults: { captions: false, hook: false }, settings: ["range","quality"] },
    ];
    const FALLBACK_QUALITY = [
      { id: "fast", name: "Fast", line: "Quickest" }, { id: "balanced", name: "Balanced", line: "Accents, noise" }, { id: "accurate", name: "Accurate", line: "Best words" },
    ];
    const DUR = [
      { id: "xshort", label: "Extra short", hint: "10–30s", min: 10, max: 30 },
      { id: "short", label: "Short", hint: "30–60s", min: 30, max: 60 },
      { id: "medium", label: "Medium", hint: "1–2m", min: 60, max: 120 },
      { id: "long", label: "Long", hint: "2–5m", min: 120, max: 300 },
      { id: "midform", label: "Mid-form", hint: "3–15m", min: 180, max: 900 },
    ];
    const ASPECTS = [
      { v: "9:16", l: "Vertical", h: "Shorts · Reels · TikTok" },
      { v: "4:5", l: "Portrait", h: "Instagram feed" },
      { v: "1:1", l: "Square", h: "Feed" },
      { v: "16:9", l: "Horizontal", h: "YouTube · X" },
    ];
    const STYLES = ["pop", "impact", "clean", "glow", "neon", "boxed"];
    const TOOL_LABEL = { clip: "Clips", captions: "Captions", reframe: "Reframe", tighten: "Tighten", transcript: "Transcript" };

    const state = {
      page: "clips", tool: null, sort: "score", filter: "all", view: "list", moreSet: false, clipInit: false, tools: FALLBACK_TOOLS, quality: FALLBACK_QUALITY,
      src: "", probe: null, err: "",
      aspect: "9:16", layout: "auto", max_clips: 3, dur: "short",
      face: "top", face_ratio: 35, filter: "none", caption_pos: "auto", audio: "off", progress: false, fixes: "",
      edit: null, editBusy: false, editMsg: "",
      style: "pop", captions: true, pacing: "tight", whisper: "fast",
      live_seconds: 1200, live_from_start: false, trim: false, start: "", end: "",
      prompt: "", q: "", hook: true, why: [], keywords: "", picked: false,
      jobs: [], library: [], folders: [], folder: "", open: null, copy: null, trash: [], tx: null,
    };
    const LAYOUTS = [["auto","Auto","Hermes reads the frame"],["fill","Speaker","crop to the face"],["split","Split","facecam + screen"],["fit","Classic","whole frame, blur pad"]];
    const FILTERS = [["none","None"],["punch","Punch"],["warm","Warm"],["cool","Cool"],["cinematic","Cinematic"],["vintage","Vintage"],["bw","B&W"],["bright","Bright"]];
    const CAPPOS = [["auto","Auto"],["top","Top"],["middle","Middle"],["bottom","Bottom"]];
    const lookOf = () => ({ layout: state.layout, face: state.face, face_ratio: Number(state.face_ratio) || 35, filter: state.filter, caption_pos: state.caption_pos, audio: state.audio, progress: !!state.progress });
    const $ = (s, el = document) => el.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const slugify = (t) => String(t || "clip").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "clip";
    const fmt = (n) => { if (!n && n !== 0) return ""; const s = Math.floor(n % 60).toString().padStart(2, "0"); return Math.floor(n / 60) + ":" + s; };
    const toolById = (id) => state.tools.find(t => t.id === id);
    async function api(path, opts) {
      opts = opts || {};
      if (opts.method && opts.method !== "GET") {
        opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
        if (!opts.body) opts.body = "{}";
      }
      const res = await fetch(path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.error || res.statusText);
      return data;
    }

    async function loadTools() {
      try { const d = await api("/api/tools"); if (d.tools && d.tools.length) state.tools = d.tools; if (d.quality) state.quality = d.quality; } catch {}
      renderRail(); render();
    }
    function renderRail() {
      $("#tool-rail").innerHTML = state.tools.filter(t => t.id !== "clip").map(t => `<button data-tool="${t.id}" class="${state.page==="create"&&state.tool===t.id?"on":""}"><span class="nm">${esc(t.name)}</span></button>`).join("");
      document.querySelectorAll("#tool-rail [data-tool]").forEach(b => b.onclick = () => pickTool(b.dataset.tool));
      document.querySelectorAll("#pages [data-page]").forEach(b => b.classList.toggle("on", b.dataset.page === state.page && !(state.page === "create" && state.tool)));
      const mc = document.querySelector("main"); if (mc) mc.scrollTop = 0;
    }
    function pickTool(id) {
      if (id === "clip") { go("#/clips"); return; }
      if (!toolById(id)) return;
      state.why = []; state.picked = false;
      go("#/tools/" + id);
    }

    async function refresh() {
      try {
        const jobs = await api("/api/jobs"); state.jobs = jobs.jobs || [];
        const lib = await api("/api/library"); state.library = lib.runs || []; state.folders = lib.folders || [];
      } catch { return; }
      const live = state.jobs.filter(j => j.status === "queued" || j.status === "running").length;
      $("#job-ct").textContent = live ? live + " live" : (state.jobs.length || "");
      $("#job-ct").classList.toggle("live", !!live);
      $("#lib-ct").textContent = state.library.length || "";
      const running = state.jobs.filter(j => j.status === "running").length, queued = live - running;
      const tl = $("#top-live"); tl.textContent = [running ? running + " running" : "", queued ? queued + " queued" : ""].filter(Boolean).join(" · "); tl.hidden = !live;
      if (state.open && state.open.pending) { const f = state.library.find(j => j.id === state.open.id); if (f) { state.open = f; try { const t = await api("/api/trash?job=" + encodeURIComponent(f.id)); state.trash = t.files || []; } catch {} render(); } }
      const clipRuns = state.library.filter(j => (j.mode || "clip") === "clip").length;
      $("#clip-ct").textContent = clipRuns || "";
      if (state.page === "clips" && !state.open) { const pj = $("#projects"); if (pj) { pj.innerHTML = projectsHtml(); bindProjects(); } return; }
      if (state.page === "clips" && state.open) {
        const live = state.library.find(x => x.id === state.open.id);
        if (live && JSON.stringify(live.clips.map(c => [c.file, c.title])) !== JSON.stringify(state.open.clips.map(c => [c.file, c.title]))) { state.open = live; render(); }
        return;
      }
      if (state.page === "create") return;
      if (state.page === "library" && state.open) return;
      const sig = JSON.stringify([state.page, state.q, state.jobs.map(j => [j.id, j.status, j.progress, j.message]), state.library.length]);
      if (sig === state.sig) return;
      state.sig = sig; render();
    }
    function nav(page) { go(page === "create" ? "#/tools" : "#/" + page); }
    function go(hash) {
      grabForm();
      if (location.hash !== hash) history.pushState(null, "", hash);
      applyRoute();
    }
    function applyRoute() {
      const parts = (location.hash || "#/clips").replace(/^#\/?/, "").split("/").map(decodeURIComponent);
      const [page, arg] = [parts[0] || "clips", parts[1] || ""];
      state.err = ""; state.tx = null;
      if (page === "tools") { state.page = "create"; state.open = null; if (arg && toolById(arg)) { state.tool = arg; Object.assign(state, toolById(arg).defaults || {}); } else state.tool = null; }
      else if (page === "library" || page === "jobs") { state.page = page; state.open = arg ? (state.library.find(j => j.id === arg) || null) : null; }
      else { state.page = "clips"; state.open = arg ? (state.library.find(j => j.id === arg) || { id: arg, clips: [], pending: true }) : null; if (!state.clipInit) { Object.assign(state, (toolById("clip") || {}).defaults || {}); state.clipInit = true; } }
      renderRail(); render();
      if (state.page === "library" && state.open) openRun(state.open.id, true);
    }
    window.addEventListener("popstate", applyRoute);
    document.querySelectorAll("#pages [data-page]").forEach(b => b.addEventListener("click", () => nav(b.dataset.page)));

    function render() {
      const main = $("#main .wrap");
      main.innerHTML = state.page === "clips" ? clipsPage() : state.page === "create" ? createPage() : state.page === "library" ? libraryPage() : jobsPage();
      bind();
    }


    /* ---------- Clips (Opus-style) ---------- */
    function clipsPage() {
      if (state.open) return projectPage(state.open);
      const p = state.probe;
      const probeLine = p ? (p.ok ? `<span class="ok">${esc(p.title)}</span>${p.duration ? ` <span class="mono">${fmt(p.duration)}</span>` : ""}${p.is_live ? ` <span class="mono" style="color:var(--ember)">LIVE</span>` : ""}` : `<span style="color:var(--bad)">${esc(p.error)}</span>`) : "YouTube, Twitch, Kick, X, TikTok, a live stream, or a file on this machine.";
      const d = DUR.find(x => x.id === state.dur) || DUR[1];
      return `<p class="kicker">Clips</p><h1>Long video in.<br>Shorts out.</h1>
        <p class="lede">Paste a link. Hermes finds the moments, scores them, names them and captions them. You pick what to post.</p>
        ${state.err ? `<p class="err">${esc(state.err)}</p>` : ""}
        <div class="drop">
          <div class="row"><input id="src" value="${esc(state.src)}" placeholder="Paste a link or a file path" autocomplete="off" />
          <button class="btn" id="probe-btn">Check</button><button class="btn primary" id="clip-run">Get clips</button></div>
          <p class="hint probe">${probeLine}</p>
        </div>
        ${state.why.length ? `<ul class="why">${state.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
        <div class="setbar">
          <div><label class="f">Find</label><input id="prompt" value="${esc(state.prompt)}" placeholder="Best moments, or a topic" /></div>
          <div><label class="f">Clip length</label><select id="dur-sel">${DUR.map(x => `<option value="${x.id}" ${state.dur === x.id ? "selected" : ""}>${x.label} · ${x.hint}</option>`).join("")}</select></div>
          <div><label class="f">How many</label><div class="opts">${[3,5,8,12].map(n => `<button class="opt ${state.max_clips==n?"on":""}" data-k="max_clips" data-v="${n}" data-n="1">${n}</button>`).join("")}</div></div>
          <div><label class="f">Format</label><div class="opts">${ASPECTS.map(a => `<button class="opt ${state.aspect===a.v?"on":""}" data-k="aspect" data-v="${a.v}" title="${a.h}">${a.v}</button>`).join("")}</div></div>
          <div><label class="f">Framing</label><div class="opts">${LAYOUTS.map(([v,l,h]) => `<button class="opt ${state.layout===v?"on":""}" data-k="layout" data-v="${v}" title="${h}">${l}</button>`).join("")}</div></div>
          ${state.layout === "split" ? `<div><label class="f">Face</label><div class="opts"><button class="opt ${state.face==="top"?"on":""}" data-k="face" data-v="top">On top</button><button class="opt ${state.face==="bottom"?"on":""}" data-k="face" data-v="bottom">On bottom</button></div></div>` : ""}
        </div>
        <button class="more" id="more-btn">${state.moreSet ? "Fewer settings −" : "More settings +"}</button>
        ${state.moreSet ? `<div class="setbar" style="margin-top:.6rem">
          <div><label class="f">Timeframe</label><div class="row" style="flex-wrap:nowrap"><input id="start" placeholder="start 0:00" value="${esc(state.start)}" /><input id="end" placeholder="end" value="${esc(state.end)}" /></div></div>
          <div><label class="f">Filter</label><select id="filter-sel">${FILTERS.map(([v,l]) => `<option value="${v}" ${state.filter===v?"selected":""}>${l}</option>`).join("")}</select></div>
          <div><label class="f">Caption spot</label><div class="opts">${CAPPOS.map(([v,l]) => `<button class="opt ${state.caption_pos===v?"on":""}" data-k="caption_pos" data-v="${v}">${l}</button>`).join("")}</div></div>
          <div><label class="f">Audio</label><div class="opts"><button class="opt ${state.audio==="off"?"on":""}" data-k="audio" data-v="off">As is</button><button class="opt ${state.audio==="clean"?"on":""}" data-k="audio" data-v="clean" title="Denoise + loudness to -14 LUFS">Clean + loud</button></div></div>
          ${state.layout === "split" ? `<div><label class="f">Face band · ${state.face_ratio}%</label><input type="range" id="face-ratio" min="20" max="60" step="5" value="${state.face_ratio}" /></div>` : ""}
          <div><label class="f">Fix words</label><input id="fixes" value="${esc(state.fixes)}" placeholder="cloud=Claude, marz=Mars" /></div>
          <div><label class="f">Progress bar</label><label class="check" style="margin:.5rem 0 0"><input type="checkbox" id="progress" ${state.progress ? "checked" : ""}> Thin amber bar</label></div>
          <div><label class="f">Captions</label><select id="style-sel"><option value="off" ${!state.captions ? "selected" : ""}>Off</option>${STYLES.map(x => `<option value="${x}" ${state.captions && state.style === x ? "selected" : ""}>${x[0].toUpperCase() + x.slice(1)}</option>`).join("")}</select></div>
          <div><label class="f">Highlight words</label><input id="keywords" value="${esc(state.keywords || "")}" placeholder="money, never, secret" /></div>
          <div><label class="f">Pacing</label><div class="opts"><button class="opt ${state.pacing==="tight"?"on":""}" data-k="pacing" data-v="tight">Tight</button><button class="opt ${state.pacing==="natural"?"on":""}" data-k="pacing" data-v="natural">Natural</button></div></div>
          <div><label class="f">Transcription</label><div class="opts">${state.quality.map(q => `<button class="opt ${state.whisper===q.id?"on":""}" data-k="whisper" data-v="${q.id}">${esc(q.name)}</button>`).join("")}</div></div>
          <div><label class="f">Hook title</label><label class="check" style="margin:.5rem 0 0"><input type="checkbox" id="hook" ${state.hook ? "checked" : ""}> Name on screen, first 3s</label></div>
          <div><label class="f">If it's live</label><select id="live-sel">${[[600,"Record 10 min"],[1200,"Record 20 min"],[1800,"Record 30 min"],[3600,"Record 60 min"]].map(([v,l]) => `<option value="${v}" ${state.live_seconds==v?"selected":""}>${l}</option>`).join("")}</select></div>
        </div>` : ""}
        <div class="row" style="margin-top:.6rem"><button class="btn sm" id="best-btn">Auto settings</button><span class="hint">${esc(state.max_clips + " × " + d.hint + " · " + state.aspect + " · " + (LAYOUTS.find(x => x[0] === state.layout) || ["", "Auto"])[1].toLowerCase() + (state.layout === "split" ? " face " + state.face : "") + (state.filter !== "none" ? " · " + state.filter : "") + " · " + (state.captions ? state.style : "no captions") + (state.audio === "clean" ? " · clean audio" : "") + " · " + state.whisper)}</span></div>
        <div class="proj-h"><h2>Projects</h2><span class="hint">Newest first</span></div>
        <div id="projects">${projectsHtml()}</div>`;
    }
    function projectsHtml() {
      const live = state.jobs.filter(j => (j.mode || "clip") === "clip" && (j.status === "queued" || j.status === "running" || j.status === "failed"));
      const done = state.library.filter(j => (j.mode || "clip") === "clip");
      if (!live.length && !done.length) return `<div class="empty">No projects yet. Paste a link above.</div>`;
      const card = (j, busy) => {
        const thumb = (j.clips || []).find(c => c.thumb);
        const best = viral(j);
        const kept = (j.clips || []).filter(c => c.liked !== false).length;
        return `<article class="proj" ${busy ? "" : `data-proj="${j.id}" role="button" tabindex="0"`}>
          <div class="cover">${thumb ? `<img src="/media/${j.id}/${thumb.thumb}" alt="" loading="lazy">` : ""}<span class="badge">${esc(j.platform || "")}</span>${best ? `<span class="best">${best}</span>` : ""}</div>
          <h3>${esc(j.title || j.id)}</h3>
          <p>${busy ? `<span class="st ${esc(j.status)}">${esc(j.status === "failed" ? "Failed · " + (j.error || j.message || "") : (j.stage || j.status) + (j.message ? " · " + j.message : ""))}</span>` : `${kept} clip${kept === 1 ? "" : "s"} · ${esc(j.aspect || "9:16")}${(j.look && j.look.layout === "split") || j.layout === "split" ? " split" : j.layout === "fill" ? " speaker" : ""}${j.created_at ? " · " + esc(ago(j.created_at)) : ""}`}</p>
          ${busy && j.status !== "failed" ? `<div class="bar"><i style="width:${Math.round((j.progress || 0) * 100)}%"></i></div>` : ""}
          ${j.status === "failed" ? `<div class="row" style="margin-top:.5rem"><button class="btn sm" data-retry="${j.id}">Retry</button></div>` : ""}
        </article>`;
      };
      return `<div class="projects">${live.map(j => card(j, true)).join("")}${done.map(j => card(j, false)).join("")}</div>`;
    }
    function ago(iso) {
      const s = (Date.now() - Date.parse(iso)) / 1000;
      if (!isFinite(s)) return "";
      if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
      if (s < 86400) return Math.round(s / 3600) + " h ago";
      return Math.round(s / 86400) + " d ago";
    }
    function bindProjects() {
      document.querySelectorAll("[data-proj]").forEach(el => {
        el.onclick = () => go("#/clips/" + encodeURIComponent(el.dataset.proj));
        el.onkeydown = (e) => { if (e.key === "Enter") el.onclick(); };
      });
      document.querySelectorAll("#projects [data-retry]").forEach(el => el.onclick = async (e) => { e.stopPropagation(); await api("/api/jobs/" + el.dataset.retry + "/retry", { method: "POST" }); refresh(); });
    }
    function sortedClips(j) {
      let clips = (j.clips || []).map((c, i) => ({ ...c, _i: i }));
      const hidden = clips.filter(c => c.liked === false).length;
      if (state.filter === "liked") clips = clips.filter(c => c.liked === true);
      else if (state.filter === "hidden") clips = clips.filter(c => c.liked === false);
      else clips = clips.filter(c => c.liked !== false);
      if (state.sort === "score") clips.sort((a, b) => (b.virality || 0) - (a.virality || 0) || a._i - b._i);
      else clips.sort((a, b) => ((a.start || 0) - (b.start || 0)) || a._i - b._i);
      return { clips, hidden };
    }
    function partsHtml(c) {
      const p = c.parts || {};
      if (p.hook == null) return "";
      return `<div class="parts">${[["Hook", p.hook], ["Flow", p.flow], ["Value", p.value]].map(([k, v]) => `<div>${k}<span>${v}</span><i><b style="width:${Math.min(100, v)}%"></b></i></div>`).join("")}</div>`;
    }

    function editPanel(j, c) {
      const e = state.edit;
      const opt = (k, v, l) => `<button class="opt ${String(e[k])===String(v)?"on":""}" data-ek="${k}" data-v="${v}">${l}</button>`;
      return `<div class="editp">
        <div class="setbar">
          <div><label class="f">Framing</label><div class="opts">${LAYOUTS.map(([v,l]) => opt("layout", v, l)).join("")}</div></div>
          <div><label class="f">Face</label><div class="opts">${opt("face","top","On top")}${opt("face","bottom","On bottom")}</div><p class="hint" style="margin:.35rem 0 0">Split layout</p></div>
          <div><label class="f">Face band · <span id="ebv">${e.face_ratio}</span>%</label><input type="range" id="e-ratio" min="20" max="60" step="5" value="${e.face_ratio}" /></div>
          <div><label class="f">Filter</label><select id="e-filter">${FILTERS.map(([v,l]) => `<option value="${v}" ${e.filter===v?"selected":""}>${l}</option>`).join("")}</select></div>
          <div><label class="f">Captions</label><select id="e-style"><option value="off" ${e.captions===false?"selected":""}>Off</option>${STYLES.map(x => `<option value="${x}" ${e.captions!==false && e.style===x?"selected":""}>${x[0].toUpperCase()+x.slice(1)}</option>`).join("")}</select></div>
          <div><label class="f">Caption spot</label><div class="opts">${CAPPOS.map(([v,l]) => opt("caption_pos", v, l)).join("")}</div></div>
          <div><label class="f">Audio</label><div class="opts">${opt("audio","off","As is")}${opt("audio","clean","Clean + loud")}</div></div>
          <div><label class="f">In / out on the source</label><div class="row" style="flex-wrap:nowrap"><input id="e-start" value="${esc(e.start)}" placeholder="start s" /><input id="e-end" value="${esc(e.end)}" placeholder="end s" /></div></div>
          <div><label class="f">Fix words</label><input id="e-fixes" value="${esc(e.fixes)}" placeholder="cloud=Claude" /></div>
          <div><label class="f">Progress bar</label><label class="check" style="margin:.5rem 0 0"><input type="checkbox" id="e-progress" ${e.progress ? "checked" : ""}> Thin amber bar</label></div>
        </div>
        <div class="row"><button class="btn primary sm" id="e-apply" ${state.editBusy ? "disabled" : ""}>${state.editBusy ? "Rendering…" : "Apply"}</button><button class="btn sm quiet" id="e-cancel">Cancel</button><span class="hint">${esc(state.editMsg || "Re-renders this clip from the source. The old version goes to Dropped.")}</span></div>
      </div>`;
    }
    function openEdit(j, c) {
      const lk = c.look || j.look || {};
      state.edit = {
        file: c.file, layout: lk.layout || c.layout || j.layout || "auto", face: lk.face || "top",
        face_ratio: Math.round((lk.face_ratio || 0.35) * 100), filter: lk.filter || "none",
        caption_pos: lk.caption_pos || "auto", audio: lk.audio || "off", progress: !!lk.progress,
        style: c.style || j.style || "pop", captions: j.captions !== false,
        start: c.start != null ? Number(c.start).toFixed(1) : "", end: c.end ? Number(c.end).toFixed(1) : "",
        fixes: Object.entries(j.fixes || {}).map(([a, b]) => a + "=" + b).join(", "),
      };
      state.editMsg = "";
    }
    function grabEdit() {
      const e = state.edit; if (!e) return;
      const g = (id) => document.getElementById(id);
      if (g("e-ratio")) e.face_ratio = Number(g("e-ratio").value);
      if (g("e-filter")) e.filter = g("e-filter").value;
      if (g("e-style")) { const v = g("e-style").value; if (v === "off") e.captions = false; else { e.captions = true; e.style = v; } }
      if (g("e-start")) e.start = g("e-start").value;
      if (g("e-end")) e.end = g("e-end").value;
      if (g("e-fixes")) e.fixes = g("e-fixes").value;
      if (g("e-progress")) e.progress = g("e-progress").checked;
    }
    function bindEdit() {
      document.querySelectorAll("[data-edit]").forEach(el => el.onclick = () => {
        const j = state.open; const c = j && (j.clips || []).find(x => x.file === el.dataset.edit);
        if (state.edit && state.edit.file === el.dataset.edit) state.edit = null; else if (c) openEdit(j, c);
        render();
      });
      if (!state.edit) return;
      document.querySelectorAll("[data-ek]").forEach(el => el.onclick = () => { grabEdit(); state.edit[el.dataset.ek] = el.dataset.v; render(); });
      const r = $("#e-ratio"); if (r) r.oninput = () => { $("#ebv").textContent = r.value; };
      const cancel = $("#e-cancel"); if (cancel) cancel.onclick = () => { state.edit = null; render(); };
      const apply = $("#e-apply");
      if (apply) apply.onclick = async () => {
        grabEdit(); const e = state.edit; const j = state.open;
        state.editBusy = true; state.editMsg = ""; render();
        try {
          const res = await api("/api/restyle", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
            job: j.id, file: e.file, style: e.style, captions: e.captions,
            look: { layout: e.layout, face: e.face, face_ratio: e.face_ratio, filter: e.filter, caption_pos: e.caption_pos, audio: e.audio, progress: e.progress },
            start: e.start, end: e.end, fixes: e.fixes,
          })});
          await refresh();
          const live = state.library.find(x => x.id === j.id); if (live) state.open = live;
          try { const t = await api("/api/trash?job=" + encodeURIComponent(j.id)); state.trash = t.files || []; } catch {}
          state.editMsg = "Done · " + (LAYOUTS.find(x => x[0] === res.layout) || ["", res.layout])[1] + " · " + Math.round(res.end - res.start) + "s";
          state.bust = Date.now();
        } catch (err) { state.editMsg = err.message; }
        state.editBusy = false; render();
      };
    }
    function projectPage(j) {
      if (j.pending) return `<p class="kicker"><a href="#/clips">Clips</a></p><h1>Loading…</h1>`;
      const wide = j.aspect === "16:9" || j.aspect === "source";
      const { clips, hidden } = sortedClips(j);
      const liked = (j.clips || []).filter(c => c.liked === true).length;
      const copy = state.copy && state.copy.job === j.id ? state.copy : null;
      const actions = (c) => `<div class="cact">
          <a class="btn sm" href="/media/${j.id}/${c.file}" download="${esc(slugify(c.title || c.file))}.mp4">Download</a>
          <button class="btn sm ${c.liked === true ? "on" : ""}" data-like="${esc(c.file)}" aria-label="Like">♥</button>
          <button class="btn sm" data-hide="${esc(c.file)}">${c.liked === false ? "Unhide" : "Hide"}</button>
          <input data-split-at="${esc(c.file)}" placeholder="split s" />
          <button class="btn sm" data-split="${esc(c.file)}">Split</button>
          <button class="btn sm" data-dup="${esc(c.file)}">Copy</button>
          <button class="btn sm quiet" data-drop="${esc(c.file)}">Drop</button>
          <button class="btn sm ${state.edit && state.edit.file === c.file ? "on" : ""}" data-edit="${esc(c.file)}">Edit</button></div>
          ${state.edit && state.edit.file === c.file ? editPanel(j, c) : ""}`;
      const title = (c) => `<textarea class="ttl" rows="2" data-title="${esc(c.file)}" aria-label="Clip name" maxlength="90">${esc(c.title || c.file)}</textarea>`;
      const list = clips.map((c, n) => `<article class="crow ${wide ? "wide" : ""}">
          <span class="rank">#${n + 1}</span>
          <video controls playsinline preload="none" poster="${c.thumb ? `/media/${j.id}/${c.thumb}?v=${state.bust || 0}` : ""}" src="/media/${j.id}/${c.file}?v=${state.bust || 0}"></video>
          <div>
            ${title(c)}
            <p class="meta">${c.end ? fmt(c.start) + "–" + fmt(c.end) + " · " + Math.round(c.end - c.start) + "s" : esc(c.file)}${c.layout ? " · " + esc((LAYOUTS.find(x => x[0] === c.layout) || ["", c.layout])[1]) : ""}${c.look && c.look.filter && c.look.filter !== "none" ? " · " + esc(c.look.filter) : ""}</p>
            ${c.virality ? `<div class="vscore"><span class="big">${c.virality}<small>/99</small></span>${partsHtml(c)}</div>` : ""}
            ${c.text ? `<p class="words" data-words>${esc(c.text)}</p>` : ""}
            ${actions(c)}
          </div></article>`).join("");
      const grid = clips.map((c, n) => `<article class="ccard ${wide ? "wide" : ""}">
          <video controls playsinline preload="none" poster="${c.thumb ? `/media/${j.id}/${c.thumb}` : ""}" src="/media/${j.id}/${c.file}"></video>
          <div class="top"><span class="mono hint">#${n + 1}${c.end ? " · " + Math.round(c.end - c.start) + "s" : ""}</span>${c.virality ? `<b>${c.virality}</b>` : ""}</div>
          ${title(c)}<div class="cact">
            <a class="btn sm" href="/media/${j.id}/${c.file}" download="${esc(slugify(c.title || c.file))}.mp4">Download</a>
            <button class="btn sm ${c.liked === true ? "on" : ""}" data-like="${esc(c.file)}" aria-label="Like">♥</button>
            <button class="btn sm" data-hide="${esc(c.file)}">${c.liked === false ? "Unhide" : "Hide"}</button></div></article>`).join("");
      return `<p class="kicker"><a href="#/clips">Clips</a> · <a href="#/library" id="to-folder" data-folder-go="${esc(j.platform || "")}">${esc(j.platform || "Other")}</a></p>
        <h1 style="font-size:clamp(26px,3vw,40px)">${esc(j.title)}</h1>
        <p class="hint" style="margin:0 0 1.2rem">${(j.clips || []).length} clips · ${esc(j.aspect || "9:16")} · ${esc(j.style || "")}${j.created_at ? " · " + esc(ago(j.created_at)) : ""}</p>
        ${state.err ? `<p class="err">${esc(state.err)}</p>` : ""}
        <div class="ptool">
          <div class="opts"><button class="opt ${state.sort==="score"?"on":""}" data-view-k="sort" data-v="score">By score</button><button class="opt ${state.sort==="time"?"on":""}" data-view-k="sort" data-v="time">Timeline</button></div>
          <div class="opts"><button class="opt ${state.filter==="all"?"on":""}" data-view-k="filter" data-v="all">All</button><button class="opt ${state.filter==="liked"?"on":""}" data-view-k="filter" data-v="liked">Liked ${liked || ""}</button><button class="opt ${state.filter==="hidden"?"on":""}" data-view-k="filter" data-v="hidden">Hidden ${hidden || ""}</button></div>
          <div class="opts"><button class="opt ${state.view==="list"?"on":""}" data-view-k="view" data-v="list">List</button><button class="opt ${state.view==="grid"?"on":""}" data-view-k="view" data-v="grid">Grid</button></div>
          <span class="spacer"></span>
          <button class="btn sm" id="name-btn" data-job="${j.id}">AI name</button>
          <button class="btn sm" id="copy-btn" data-job="${j.id}">Social copy</button>
        </div>
        ${copy ? `<div class="copy"><p class="kicker">${esc(copy.source || "copy")}</p><ul>${(copy.titles || []).map(t => `<li>${esc(t)}</li>`).join("")}</ul><p class="lede" style="margin:0 0 .4rem">${esc(copy.description || "")}</p><p class="hint mono">${esc((copy.hashtags || []).join(" "))}</p></div>` : ""}
        ${clips.length ? (state.view === "grid" ? `<div class="cgrid">${grid}</div>` : `<div class="clist">${list}</div>`) : `<div class="empty">${state.filter === "liked" ? "No liked clips yet. Tap ♥ on the ones you want." : state.filter === "hidden" ? "Nothing hidden." : "No clips in this project."}</div>`}
        ${(state.trash || []).length ? `<p class="kicker" style="margin-top:2rem">Dropped</p><div class="row">${state.trash.map(t => `<button class="btn sm" data-restore="${esc(t.file)}">Restore ${esc(t.file)}</button>`).join("")}</div>` : ""}`;
    }
    /* ---------- Create ---------- */
    function createPage() {
      if (!state.tool) return toolPicker();
      const t = toolById(state.tool);
      const on = (k) => (t.settings || []).includes(k);
      return `<p class="kicker"><a href="#/tools" id="all-tools">Other tools</a></p>
        <div class="picked"><span class="name">${esc(t.name)}</span><span class="hint">${esc(t.output)}</span></div>
        <p class="lede">${esc(t.line)}</p>
        ${state.err ? `<p class="err">${esc(state.err)}</p>` : ""}
        ${sourceSec()}
        ${state.why.length ? `<section class="sec"><h3>Hermes pick</h3><div><ul class="why">${state.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div></section>` : ""}
        ${on("hunt") ? huntSec() : ""}
        ${on("range") ? rangeSec() : ""}
        ${on("format") ? formatSec(t) : ""}
        ${on("length") ? lengthSec() : ""}
        ${on("captions") ? captionSec(t) : ""}
        ${qualitySec()}
        <div class="actions">
          ${t.id === "clip" ? `<button class="btn" id="best-btn">Let Hermes pick</button>` : ""}
          <span class="spacer"></span>
          <span class="hint">${summary(t)}</span>
          <button class="btn primary" id="run-btn">Run ${esc(t.name)}</button>
        </div>`;
    }
    function toolPicker() {
      return `<p class="kicker">Other tools</p><h1>One job each.</h1>
        <p class="lede">For clips, use the Clips page. These tools do one job on the whole video. Everything runs on this machine, and nothing is posted.</p>
        <div class="index">${state.tools.filter(t => t.id !== "clip").map(t => `<button class="index-row" data-tool="${t.id}">
          <span class="name">${esc(t.name)}</span>
          <span class="desc"><b>${esc(t.verb)}</b>${esc(t.line)}</span>
          <span class="out">${esc(t.output)}</span><span class="arw" aria-hidden="true">→</span></button>`).join("")}</div>`;
    }
    function sourceSec() {
      const p = state.probe;
      const probeLine = p ? (p.ok ? `<span class="ok">${esc(p.title)}</span>${p.duration ? ` <span class="mono">${fmt(p.duration)}</span>` : ""}${p.is_live ? ` <span class="mono" style="color:var(--ember)">LIVE</span>` : ""}` : `<span style="color:var(--bad)">${esc(p.error)}</span>`) : "File path, YouTube, X, Twitch or a livestream.";
      return `<section class="sec"><h3>Source</h3><div>
        <div class="row" style="flex-wrap:nowrap"><input id="src" value="${esc(state.src)}" placeholder="https://youtube.com/…  or  /path/to/video.mp4" /><button class="btn" id="probe-btn" style="margin-bottom:1rem">Check</button></div>
        <p class="hint" style="margin:-.4rem 0 1rem">${probeLine}</p></div></section>`;
    }
    function huntSec() {
      return `<section class="sec"><h3>Hunt</h3><div>
        <input id="prompt" value="${esc(state.prompt)}" placeholder="Optional. Words to hunt for: money, mistake, wait what" />
        </div></section>`;
    }
    function rangeSec() {
      return `<section class="sec"><h3>Range</h3><div>
        <label class="check"><input type="checkbox" id="trim" ${state.trim ? "checked" : ""}> Only part of the video</label>
        ${state.trim ? `<div class="row" style="margin-bottom:1rem"><input id="start" placeholder="start · 90 or 1:30" value="${esc(state.start)}" style="max-width:180px"><input id="end" placeholder="end" value="${esc(state.end)}" style="max-width:180px"></div>` : ""}
        <label class="f">If it's live, record</label>
        <div class="opts">${[[600,"10 min"],[1200,"20 min"],[1800,"30 min"],[3600,"60 min"]].map(([v,l]) => `<button class="opt ${state.live_seconds==v?"on":""}" data-k="live_seconds" data-v="${v}" data-n="1">${l}</button>`).join("")}</div>
        <label class="check"><input type="checkbox" id="live_from_start" ${state.live_from_start ? "checked" : ""}> YouTube live from the start</label>
        </div></section>`;
    }
    function formatSec(t) {
      const aspects = t.id === "tighten" ? [{ v: "source", l: "Keep", h: "Source frame" }, ...ASPECTS] : ASPECTS;
      return `<section class="sec"><h3>Format</h3><div>
        <div class="opts">${aspects.map(a => `<button class="opt ${state.aspect===a.v?"on":""}" data-k="aspect" data-v="${a.v}">${a.l}<small>${a.v === "source" ? a.h : a.v}</small></button>`).join("")}</div>
        ${state.aspect !== "source" ? `<label class="f">Framing</label>
        <div class="opts">${LAYOUTS.map(([v,l,h]) => `<button class="opt ${state.layout===v?"on":""}" data-k="layout" data-v="${v}">${l}<small>${h}</small></button>`).join("")}</div>
        ${state.layout === "split" ? `<label class="f">Face</label><div class="opts"><button class="opt ${state.face==="top"?"on":""}" data-k="face" data-v="top">On top</button><button class="opt ${state.face==="bottom"?"on":""}" data-k="face" data-v="bottom">On bottom</button></div>` : ""}
        <label class="f">Filter</label><div class="opts">${FILTERS.map(([v,l]) => `<button class="opt ${state.filter===v?"on":""}" data-k="filter" data-v="${v}">${l}</button>`).join("")}</div>` : ""}
        </div></section>`;
    }
    function lengthSec() {
      return `<section class="sec"><h3>Length</h3><div>
        <div class="opts">${DUR.map(d => `<button class="opt ${state.dur===d.id?"on":""}" data-k="dur" data-v="${d.id}">${d.label}<small>${d.hint}</small></button>`).join("")}</div>
        <label class="f">How many</label>
        <div class="opts">${[3,5,8].map(n => `<button class="opt ${state.max_clips==n?"on":""}" data-k="max_clips" data-v="${n}" data-n="1">${n}</button>`).join("")}</div>
        <label class="f">Pacing</label>
        <div class="opts"><button class="opt ${state.pacing==="tight"?"on":""}" data-k="pacing" data-v="tight">Tight<small>cut filler</small></button><button class="opt ${state.pacing==="natural"?"on":""}" data-k="pacing" data-v="natural">Natural<small>as spoken</small></button></div>
        </div></section>`;

    function captionSec(t) {
      return `<section class="sec"><h3>Captions</h3><div>
