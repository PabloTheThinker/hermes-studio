<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0a0b0e; --surface: #0f1117; --fg: #ececf1; --fg2: #9a9ab2;
      --mute: #6b6b82; --signal: #3b82f6; --ice: #93c5fd; --hair: rgba(255,255,255,.08);
      --danger: #f87171; --ok: #34d399;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--ink); color: var(--fg); font-family: Geist, system-ui, sans-serif; }
    #app { display: grid; grid-template-columns: 200px 1fr; grid-template-rows: 56px 1fr; min-height: 100%; }
    .top {
      grid-column: 1 / -1; display: flex; align-items: center; gap: 1rem;
      padding: 0 1.1rem; border-bottom: 1px solid var(--hair); height: 56px;
    }
    .top .brand { padding: 0; }
    .top-search { flex: 1; max-width: 480px; margin: 0; }
    .top-search input { margin: 0; height: 36px; padding: .45rem .75rem; }
    .pill {
      font-family: "Geist Mono", monospace; font-size: 10px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--ice); border: 1px solid var(--hair);
      padding: 4px 8px; white-space: nowrap;
    }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: .6rem; }
    aside { border-right: 1px solid var(--hair); padding: 1rem .7rem; display: flex; flex-direction: column; gap: .35rem; }
    .brand { display: flex; align-items: center; gap: .6rem; padding: .35rem .55rem 1rem; }
    .mark { width: 12px; height: 22px; border: 1px solid var(--signal); background: linear-gradient(180deg, var(--signal), #0a1f6b); }
    .brand-name { font-family: "Instrument Serif", serif; font-size: 1.05rem; }
    .brand-sub { font-family: "Geist Mono", monospace; font-size: 9px; letter-spacing: .16em; color: var(--mute); text-transform: uppercase; }
    nav button { display: flex; width: 100%; background: transparent; border: 0; color: var(--fg2); font: 500 13px Geist, system-ui; padding: .55rem .7rem; cursor: pointer; text-align: left; }
    nav button.active { color: var(--fg); background: rgba(59,130,246,.12); }
    .badge { margin-left: auto; font-family: "Geist Mono", monospace; font-size: 10px; background: var(--signal); color: #061018; padding: 1px 6px; }
    main { padding: 1.6rem 2rem 3rem; overflow: auto; max-width: 920px; }
    .fig { font-family: "Geist Mono", monospace; font-size: 10px; letter-spacing: .18em; color: var(--signal); text-transform: uppercase; margin: 0 0 .4rem; }
    h1 { font-family: "Instrument Serif", serif; font-size: 2.2rem; font-weight: 400; margin: 0 0 .4rem; }
    .lede { color: var(--fg2); margin: 0 0 1.2rem; line-height: 1.5; }
    label { display: block; font-family: "Geist Mono", monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 0 0 .35rem; }
    input, select { width: 100%; background: var(--surface); color: var(--fg); border: 1px solid var(--hair); padding: .7rem .8rem; font: 14px Geist, system-ui; margin: 0 0 1rem; }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .btn { display: inline-flex; align-items: center; min-height: 40px; padding: .55rem 1rem; border: 1px solid var(--hair); background: transparent; color: var(--fg); font-family: "Geist Mono", monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    .btn-signal { background: var(--signal); border-color: var(--signal); color: #061018; }
    .hint { color: var(--mute); font-size: 13px; }
    .live { color: var(--danger); font-family: "Geist Mono", monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .ok { color: var(--ok); }
    .err { color: var(--danger); white-space: pre-wrap; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .chip {
      position: absolute; top: .5rem; right: .5rem;
      font-family: "Geist Mono", monospace; font-size: 10px; letter-spacing: .08em;
      background: #0a0b0e; color: var(--ice); border: 1px solid var(--hair); padding: 2px 6px;
    }
    .card { position: relative; border: 1px solid var(--hair); background: var(--surface); cursor: pointer; }
    .card img, .card .ph { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #111; display: block; }
    .card .meta, .clip .meta { padding: .75rem .85rem 1rem; }
    .card h3, .clip h3 { margin: 0 0 .25rem; font-size: 14px; font-weight: 500; }
    .card p, .clip p { margin: 0; color: var(--mute); font-size: 12px; }
    .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .clip { border: 1px solid var(--hair); background: var(--surface); }
    .clip video { width: 100%; aspect-ratio: 9/16; object-fit: cover; background: #000; display: block; }
    .job { border: 1px solid var(--hair); padding: 1rem 1.1rem; margin: 0 0 .7rem; background: var(--surface); }
    .bar { height: 3px; background: var(--hair); margin: .7rem 0 0; }
    .bar > i { display: block; height: 3px; background: var(--signal); }
    .empty { border: 1px dashed var(--hair); padding: 2.5rem 1rem; text-align: center; color: var(--fg2); }
    .steps { display: flex; gap: .35rem; margin: 0 0 1.4rem; flex-wrap: wrap; }
    .steps button { border: 1px solid var(--hair); background: transparent; color: var(--mute); font: 500 12px Geist, system-ui; padding: .4rem .7rem; cursor: pointer; }
    .steps button.on { color: var(--fg); border-color: var(--signal); }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin: 0 0 1rem; }
    .tile { border: 1px solid var(--hair); background: var(--surface); padding: .85rem .9rem; cursor: pointer; text-align: left; color: var(--fg); }
    .tile.on { border-color: var(--signal); }
    .tile small { display: block; color: var(--mute); font-size: 12px; margin-top: .25rem; }
    .foot { display: flex; justify-content: space-between; margin-top: 1.2rem; }
    @media (max-width: 800px) {
      #app { grid-template-columns: 1fr; }
      aside { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--hair); overflow-x: auto; }
      nav { display: flex; }
      .tiles { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand"><span class="mark"></span><div><div class="brand-name">Hermes Studio</div><div class="brand-sub">HermesClip</div></div></div>
      <div class="top-search"><input id="q" placeholder="Search clips, titles, sources" /></div>
      <div class="top-actions">
        <span class="pill" id="top-live" hidden></span>
        <span class="pill">Local · no post</span>
        <button class="btn btn-signal" id="new-clip">New clip</button>
      </div>
    </header>
    <aside>
      <nav>
        <button data-page="create" class="active">Create</button>
        <button data-page="library">Library</button>
        <button data-page="jobs">Jobs <span class="badge" id="job-badge" hidden>0</span></button>
      </nav>
    </aside>
    <main id="main"></main>
  </div>
  <script>
    const STEPS = [
      { id: "video", label: "Video" },
      { id: "format", label: "Format" },
      { id: "clips", label: "Clips" },
      { id: "captions", label: "Captions" },
      { id: "review", label: "Review" },
    ];
    const DUR = [
      { id: "xshort", label: "Extra short", hint: "10–30s", min: 10, max: 30 },
      { id: "short", label: "Short", hint: "30–60s", min: 30, max: 60 },
      { id: "medium", label: "Medium", hint: "1–2m", min: 60, max: 120 },
      { id: "long", label: "Long", hint: "2–5m", min: 120, max: 300 },
      { id: "midform", label: "Mid-form", hint: "3–15m", min: 180, max: 900 },
    ];
    const state = {
      page: "create", step: "video", src: "", probe: null, err: "",
      aspect: "9:16", layout: "fit", max_clips: 3, dur: "short",
      style: "pop", captions: true, pacing: "tight",
      live_seconds: 1200, live_from_start: false, trim: false, start: "", end: "",
      prompt: "", q: "", hook: true, mode: "clip", path: "wizard", why: [],
      jobs: [], library: [], open: null,
    };
    const $ = (s, el = document) => el.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    function fmt(n) { if (!n && n !== 0) return ""; const s = Math.floor(n % 60).toString().padStart(2,"0"); return Math.floor(n/60) + ":" + s; }
    async function api(path, opts) {
      const res = await fetch(path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.error || res.statusText);
      return data;
    }
    async function refresh() {
      const jobs = await api("/api/jobs");
      state.jobs = jobs.jobs || [];
      const lib = await api("/api/library");
      state.library = lib.runs || [];
      const live = state.jobs.filter(j => j.status === "queued" || j.status === "running").length;
      const b = $("#job-badge");
      b.hidden = live === 0;
      b.textContent = live;
      const tl = $("#top-live");
      if (tl) {
        tl.textContent = live ? live + " running" : "";
        tl.hidden = !live;
      }
      if (state.page === "create") return;
      if (state.page === "library" && state.open) return;
      const sig = JSON.stringify(state.jobs.map(j => [j.id, j.status, j.progress, j.message]));
      if (sig === state.sig && state.page === "jobs") return;
      state.sig = sig;
      render();
    }
    function nav(page) {
      state.page = page; state.open = null;
      document.querySelectorAll("nav button").forEach(btn => btn.classList.toggle("active", btn.dataset.page === page));
      render();
    }
    document.querySelectorAll("nav button").forEach(btn => btn.addEventListener("click", () => nav(btn.dataset.page)));
    function render() {
      const main = $("#main");
      if (state.page === "create") main.innerHTML = createPage();
      else if (state.page === "library") main.innerHTML = libraryPage();
      else main.innerHTML = jobsPage();
      bind();
    }
    function stepper() {
      return `<div class="steps">${STEPS.map(s => `<button data-step="${s.id}" class="${state.step===s.id?"on":""}">${s.label}</button>`).join("")}</div>`;
    }
    function createPage() {
      const i = STEPS.findIndex(s => s.id === state.step);
      const body = { video: videoStep, format: formatStep, clips: clipsStep, captions: capStep, review: reviewStep }[state.step]();
      return `${stepper()}
        ${state.err ? `<p class="err">${esc(state.err)}</p>` : ""}
        ${body}
        <div class="foot">
          <button class="btn" id="back" ${i===0?"disabled":""}>Back</button>
          ${state.step === "review"
            ? `<button class="btn btn-signal" id="run-btn">Generate</button>`
            : state.step === "video"
            ? `<div class="row"><button class="btn" id="next">Settings</button><button class="btn btn-signal" id="best-btn">Best recommendation</button></div>`
            : `<button class="btn btn-signal" id="next">Next</button>`}
        </div>`;
    }
    function videoStep() {
      const p = state.probe;
      return `<p class="fig">01 · Video</p><h1>Choose a video</h1>
        <p class="lede">Local file, YouTube, X, Twitch, or a livestream. Pick <em>Best recommendation</em> and Hermes analyzes the source, or walk Settings yourself. Nothing is posted.</p>
        <label>Source</label>
        <input id="src" value="${esc(state.src)}" placeholder="https://youtube.com/…  ·  /path/to/file.mp4" />
        <p class="hint">${p ? (p.ok ? `<span class="ok">${esc(p.title)}</span>${p.is_live?` <span class="live">live</span>`:""}` : `<span class="err">${esc(p.error)}</span>`) : "Paste a link, then Probe."}</p>
        <div class="row" style="margin:1rem 0"><button class="btn" id="probe-btn">Probe</button></div>
        <label><input type="checkbox" id="trim" ${state.trim?"checked":""} style="width:auto"> Clip only part of it</label>
        ${state.trim ? `<div class="row"><input id="start" placeholder="start 90 or 1:30" value="${esc(state.start)}" style="max-width:180px"><input id="end" placeholder="end" value="${esc(state.end)}" style="max-width:180px"></div>` : ""}
        <label>Job</label>
        <div class="tiles">
          <button class="tile ${state.mode==="clip"?"on":""}" data-k="mode" data-v="clip">Clips<small>Hook-first shorts</small></button>
          <button class="tile ${state.mode==="captions"?"on":""}" data-k="mode" data-v="captions">Captions only<small>Burn on the full take</small></button>
        </div>
        <label>Hunt (optional)</label>
        <input id="prompt" value="${esc(state.prompt)}" placeholder="ClipAnything-lite: e.g. money, mistake, wait what" />
        <label>Live slice</label>
        <select id="live_seconds"><option value="600">10 min</option><option value="1200" ${state.live_seconds==1200?"selected":""}>20 min</option><option value="1800">30 min</option><option value="3600">60 min</option></select>
        <label><input type="checkbox" id="live_from_start" ${state.live_from_start?"checked":""} style="width:auto"> YouTube live from start</label>`;
    }
    function formatStep() {
      return `<p class="fig">02 · Format</p><h1>Format and framing</h1>
        <p class="lede">Where the clips run, and how each shot is framed — Classic Fit is the whole-frame blur pad.</p>
        <label>Aspect</label>
        <div class="tiles">
          <button class="tile ${state.aspect==="9:16"?"on":""}" data-k="aspect" data-v="9:16">Vertical<small>Shorts, Reels, TikTok · 9:16</small></button>
          <button class="tile ${state.aspect==="1:1"?"on":""}" data-k="aspect" data-v="1:1">Square<small>Feed · 1:1</small></button>
          <button class="tile ${state.aspect==="16:9"?"on":""}" data-k="aspect" data-v="16:9">Horizontal<small>YouTube, X · 16:9</small></button>
        </div>
        <label>Framing</label>
        <div class="tiles">
          <button class="tile ${state.layout==="fit"?"on":""}" data-k="layout" data-v="fit">Classic<small>Whole frame, blurred pad</small></button>
          <button class="tile ${state.layout==="fill"?"on":""}" data-k="layout" data-v="fill">Full frame<small>Punch-in crop</small></button>
        </div>`;
    }
    function clipsStep() {
      return `<p class="fig">03 · Clips</p><h1>Length and count</h1>
        <div class="tiles">${DUR.map(d => `<button class="tile ${state.dur===d.id?"on":""}" data-k="dur" data-v="${d.id}">${d.label}<small>${d.hint}</small></button>`).join("")}</div>
        <label>How many</label>
        <select id="max_clips"><option>3</option><option ${state.max_clips==5?"selected":""}>5</option><option ${state.max_clips==8?"selected":""}>8</option></select>
        <label>Pacing</label>
        <select id="pacing"><option value="tight">Tight (cut filler)</option><option value="natural" ${state.pacing==="natural"?"selected":""}>Natural</option></select>`;
    }
    function capStep() {
      const styles = ["pop","impact","clean","glow","neon","boxed"];
      return `<p class="fig">04 · Captions</p><h1>Word-by-word captions</h1>
        <label><input type="checkbox" id="captions" ${state.captions?"checked":""} style="width:auto"> Burn captions into each clip</label>
        <label><input type="checkbox" id="hook" ${state.hook?"checked":""} style="width:auto"> Hook title overlay (first 3s)</label>
        <div class="tiles">${styles.map(s => `<button class="tile ${state.style===s?"on":""}" data-k="style" data-v="${s}">${s}</button>`).join("")}</div>`;
    }
    function reviewStep() {
      const d = DUR.find(x => x.id === state.dur);
      return `<p class="fig">05 · Review</p><h1>Generate</h1>
        <p class="lede">${esc(state.src || "(no source)")}</p>
        <p class="hint">${state.mode==="captions"?"Captions only · ":""}${state.aspect} · ${state.layout} · ${d?d.hint:""} · ${state.mode==="captions"?"1 file":state.max_clips+" clips"} · ${state.captions?state.style:"no captions"}${state.hook?" · hook":""}${state.path==="best"?" · Hermes pick":""}</p>
        ${(state.why||[]).length ? `<ul class="lede">${state.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
        <p class="hint">Up to two jobs run at once. Queue another right after.</p>`;
    }
    function viral(j) {
      const clips = j.clips || [];
      const scores = clips.map(c => (c.virality != null ? c.virality : Math.round((c.score || 0) * 100)));
      return scores.length ? Math.max(...scores) : 0;
    }
    function libraryPage() {
      if (state.open) return runDetail(state.open);
      const q = (state.q || "").trim().toLowerCase();
      let runs = state.library.slice();
      if (q) runs = runs.filter(j => (j.title || "").toLowerCase().includes(q) || (j.src || "").toLowerCase().includes(q));
      runs.sort((a, b) => viral(b) - viral(a));
      if (!runs.length) return `<p class="fig">Library</p><h1>Every finished run.</h1><div class="empty">Generate clips. They land here, newest first.</div>`;
      return `<p class="fig">Library</p><h1>${runs.length} run${runs.length===1?"":"s"}.</h1><div class="cards">${runs.map(j => {
        const thumb = (j.clips||[]).find(c => c.thumb);
        const v = viral(j);
        return `<article class="card" data-open="${j.id}">${v?`<span class="chip">${v}</span>`:""}${thumb?`<img src="/media/${j.id}/${thumb.thumb}" alt="">`:`<div class="ph"></div>`}<div class="meta"><h3>${esc(j.title||j.id)}</h3><p>${(j.clips||[]).length} clips${j.is_live?" · live":""}</p></div></article>`;
      }).join("")}</div>`;
    }
    function runDetail(j) {
      return `<p class="fig"><a href="#" id="back-lib">Library</a> · ${esc(j.id)}</p><h1>${esc(j.title)}</h1>
        <p class="lede">${esc(j.src)}</p>
        <div class="clips">${(j.clips||[]).map(c => `<article class="clip"><video controls playsinline preload="none" poster="${c.thumb?`/media/${j.id}/${c.thumb}`:""}" src="/media/${j.id}/${c.file}"></video><div class="meta"><h3>${esc(c.title||c.file)}</h3><p>${fmt(c.start)}–${fmt(c.end)} · ${Number(c.score||0).toFixed(2)}</p></div></article>`).join("")}</div>`;
    }
    function jobsPage() {
      const jobs = state.jobs;
      if (!jobs.length) return `<p class="fig">Jobs</p><h1>Queue.</h1><div class="empty">Nothing running.</div>`;
      return `<p class="fig">Jobs</p><h1>Queue and history.</h1>${jobs.map(j => {
        const pct = Math.round((j.progress||0)*100);
        const retry = (j.status==="failed"||j.status==="cancelled") ? `<button class="btn" data-retry="${j.id}">Retry</button>` : "";
        const cancel = j.status==="queued" ? `<button class="btn" data-cancel="${j.id}">Cancel</button>` : "";
        return `<article class="job"><div class="row" style="justify-content:space-between"><strong>${esc(j.title||j.id)}</strong><span class="hint">${esc(j.status)} · ${esc(j.stage||"")}</span></div>
          <p class="hint">${esc(j.message||j.error||j.src)}</p>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="row" style="margin-top:.6rem">${retry}${cancel}</div></article>`;
      }).join("")}`;
    }
    function grabForm() {
      const src = $("#src"); if (src) state.src = src.value.trim();
      const live = $("#live_seconds"); if (live) state.live_seconds = Number(live.value);
      const lfs = $("#live_from_start"); if (lfs) state.live_from_start = lfs.checked;
      const trim = $("#trim"); if (trim) state.trim = trim.checked;
      const st = $("#start"); if (st) state.start = st.value;
      const en = $("#end"); if (en) state.end = en.value;
      const mc = $("#max_clips"); if (mc) state.max_clips = Number(mc.value);
      const pc = $("#pacing"); if (pc) state.pacing = pc.value;
      const cap = $("#captions"); if (cap) state.captions = cap.checked;
      const hk = $("#hook"); if (hk) state.hook = hk.checked;
      const pr = $("#prompt"); if (pr) state.prompt = pr.value;
      const qq = $("#q"); if (qq) state.q = qq.value;
    }
    function bind() {
      document.querySelectorAll("[data-step]").forEach(el => el.onclick = () => { grabForm(); state.step = el.dataset.step; render(); });
      document.querySelectorAll("[data-k]").forEach(el => el.onclick = () => { state[el.dataset.k] = el.dataset.v; render(); });
      const back = $("#back"); if (back) back.onclick = () => { grabForm(); const i = STEPS.findIndex(s => s.id === state.step); if (i>0) { state.step = STEPS[i-1].id; render(); } };
      const next = $("#next"); if (next) next.onclick = () => { grabForm(); const i = STEPS.findIndex(s => s.id === state.step); if (i<STEPS.length-1) { state.step = STEPS[i+1].id; render(); } };
      const probeBtn = $("#probe-btn");
      if (probeBtn) probeBtn.onclick = async () => {
        grabForm(); state.err = "";
        try { state.probe = await api("/api/probe?src=" + encodeURIComponent(state.src)); }
        catch (e) { state.probe = { ok: false, error: e.message }; }
        render();
      };
      const bestBtn = $("#best-btn");
      if (bestBtn) bestBtn.onclick = async () => {
        grabForm(); state.err = "";
        if (!state.src) { state.err = "Paste a source first."; render(); return; }
        bestBtn.disabled = true; bestBtn.textContent = "Analyzing…";
        try {
          const data = await api("/api/recommend?src=" + encodeURIComponent(state.src));
          const r = data.recommendation || {};
          state.probe = { ok: true, title: data.title, is_live: data.is_live, duration: data.duration };
          state.path = "best";
          state.aspect = r.aspect || "9:16";
          state.layout = r.layout || "fit";
          state.dur = r.dur || "short";
          state.max_clips = r.max_clips || 3;
          state.pacing = r.pacing || "tight";
          state.style = r.style || "pop";
          state.captions = r.captions !== false;
          state.hook = r.hook !== false;
          state.mode = r.mode || "clip";
          state.live_seconds = r.live_seconds || 1200;
          if (r.prompt) state.prompt = r.prompt;
          state.why = r.why || [];
          state.step = "review";
        } catch (e) { state.err = e.message; }
        render();
      };
      const runBtn = $("#run-btn");
      if (runBtn) runBtn.onclick = async () => {
        grabForm(); state.err = "";
        const d = DUR.find(x => x.id === state.dur) || DUR[1];
        try {
          await api("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
            src: state.src, layout: state.layout, aspect: state.aspect, max_clips: state.max_clips,
            min_sec: d.min, max_sec: d.max, style: state.style, captions: state.captions, pacing: state.pacing,
            live_seconds: state.live_seconds, live_from_start: state.live_from_start,
            start_time: state.trim && state.start ? state.start : null,
            end_time: state.trim && state.end ? state.end : null,
            prompt: state.prompt,
            hook: state.hook,
            mode: state.mode,
            plan: "heuristic", whisper: "tiny",
          })});
          state.step = "video"; nav("jobs"); await refresh();
        } catch (e) { state.err = e.message; render(); }
      };
      document.querySelectorAll("[data-open]").forEach(el => el.onclick = () => { state.open = state.library.find(j => j.id === el.dataset.open); render(); });
      document.querySelectorAll("video").forEach(v => {
        v.addEventListener("play", () => {
          document.querySelectorAll("video").forEach(o => { if (o !== v) o.pause(); });
        });
      });
      const backLib = $("#back-lib"); if (backLib) backLib.onclick = (e) => { e.preventDefault(); state.open = null; render(); };
      document.querySelectorAll("[data-retry]").forEach(el => el.onclick = async () => { await api("/api/jobs/"+el.dataset.retry+"/retry", { method: "POST" }); refresh(); });
      document.querySelectorAll("[data-cancel]").forEach(el => el.onclick = async () => { await api("/api/jobs/"+el.dataset.cancel+"/cancel", { method: "POST" }); refresh(); });
      const trim = $("#trim"); if (trim) trim.onchange = () => { grabForm(); render(); };
    }
    document.getElementById("new-clip").onclick = () => { state.step = "video"; nav("create"); };
    document.getElementById("q").oninput = (e) => { state.q = e.target.value; if (state.page === "library" && !state.open) render(); };
    render(); refresh(); setInterval(refresh, 2500);
  </script>
</body>
</html>
