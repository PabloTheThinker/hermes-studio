[project]
name = "hermes-studio"
version = "0.5.2"
description = "Hermes Studio: long video in, captioned short clips out. Local, for people and AI agents."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "faster-whisper>=1.0.0",
  # PyAV 19 dropped open(metadata_errors=...), which faster-whisper 1.2.x still passes.
  "av>=11,<19",
  "yt-dlp>=2026.8.0",
]

[project.optional-dependencies]
reframe = ["opencv-python-headless>=4.8,<6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hermes-studio = "hermes_studio.cli:main"
hermesclip = "hermes_studio.cli:_old_name"

[tool.setuptools.packages.find]
include = ["hermes_studio*"]

[tool.setuptools.package-data]
hermes_studio = ["ui/*", "data/*"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["site", "hermes_studio/ui"]

[tool.ruff.lint]
# Real bugs (F, E9, B), import order (I), modern syntax (UP), and security (S) —
# not a style war.
select = ["F", "E9", "B", "I", "UP", "S"]
ignore = [
  "S603", "S607",  # subprocess with list args to ffmpeg / yt-dlp is the job
  "S101",          # asserts are fine in tests
  "S110", "S112",  # best-effort try/except-pass around optional helpers
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
