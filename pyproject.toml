[project]
name = "hermesclip"
version = "0.3.1"
description = "Hermes Studio — HermesClip, local 9:16 clipper for Hermes Agent"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.0.0",
  "yt-dlp>=2026.8.0",
]

[project.optional-dependencies]
reframe = ["opencv-python-headless>=4.8"]

[project.scripts]
hermesclip = "hermesclip.cli:main"

[tool.setuptools.packages.find]
include = ["hermesclip*"]

[tool.setuptools.package-data]
hermesclip = ["ui/*", "data/*"]
