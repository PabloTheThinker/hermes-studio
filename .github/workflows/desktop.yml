name: desktop
# Builds the Hermes Studio desktop app with its engine inside, then installs and
# tests it on a clean machine: a fresh ubuntu:24.04 container (Linux AppImage)
# and a Windows VM (NSIS installer). Manual or on PRs that touch the app/engine.
# The tested installers are uploaded as artifacts; releases are cut from them.
# Actions are pinned to commit SHAs so a hijacked tag can't run code here.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]          # a version tag builds, tests, then publishes the release
  pull_request:
    paths:
      - "desktop/**"
      - "hermes_studio/**"
      - "scripts/build-engine-*"
      - "scripts/clean-test-*"
      - "scripts/install.*"
      - "electron-builder.json"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/desktop.yml"
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
env:
  # BtbN static FFmpeg (GPL, includes libass). Pinned by release and sha256.
  FFMPEG_WIN_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-9.0.zip
  FFMPEG_WIN_SHA256: a0e45723c72141975f51d8666302e614711745f3102b704ca3f82c897a58d278
  FFMPEG_LINUX_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0.tar.xz
  FFMPEG_LINUX_SHA256: 68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: FFmpeg (pinned, verified)
        run: |
          curl -fsSL "$FFMPEG_LINUX_URL" -o ff.tar.xz
          echo "$FFMPEG_LINUX_SHA256  ff.tar.xz" | sha256sum -c -
          mkdir ff && tar -xJf ff.tar.xz -C ff
          echo "FFMPEG_DIR=$(dirname "$(find "$PWD/ff" -type f -name ffmpeg | head -1)")" >> "$GITHUB_ENV"
      - name: Build engine
        run: ./scripts/build-engine-linux.sh
      - name: Build AppImage
        run: |
          npm ci --no-fund --no-audit
          npx electron-builder --linux AppImage --publish never
          ls -lh dist/*.AppImage
      - name: Clean-machine test (fresh ubuntu:24.04, open, captions + clip job, quit)
        run: |
          mkdir -p work/out
          cp dist/Hermes-Studio-*.AppImage work/HermesStudio.AppImage
          cp site/assets/demo-src.mp4 work/sample.mp4
          cp scripts/clean-test-linux.sh work/
          docker run --rm -v "$PWD/work:/work" ubuntu:24.04 bash /work/clean-test-linux.sh 2>&1 \
            | grep -vE "^(debconf|dpkg)" | tee work/out/test.log
          grep -q "LINUX CLEAN TEST PASSED" work/out/test.log
      - name: One-line installer test (fresh ubuntu:24.04, no sudo, no FUSE)
        run: |
          cp scripts/install.sh scripts/clean-test-installer.sh work/
          docker run --rm -v "$PWD/work:/work" ubuntu:24.04 bash /work/clean-test-installer.sh 2>&1 \
            | grep -vE "^(debconf|dpkg)" | tee work/out/installer-test.log
          grep -q "INSTALLER CLEAN TEST PASSED" work/out/installer-test.log
      - name: Test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-test
          path: work/out/
          if-no-files-found: warn
      - name: AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage
          path: dist/Hermes-Studio-*.AppImage
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: FFmpeg (pinned, verified)
        shell: pwsh
        run: |
          Invoke-WebRequest $env:FFMPEG_WIN_URL -OutFile ff.zip
          $h = (Get-FileHash ff.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:FFMPEG_WIN_SHA256) { throw "ffmpeg sha256 mismatch: $h" }
          Expand-Archive ff.zip -DestinationPath ff
          $bin = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "FFMPEG_DIR=$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build engine
        shell: pwsh
        run: ./scripts/build-engine-windows.ps1
      - name: Build installer
        shell: pwsh
        run: |
          npm ci --no-fund --no-audit
          npx electron-builder --win nsis --publish never
          Get-ChildItem dist -Filter *.exe | Format-Table Name, Length
      - name: Clean-machine test (install, open, clip, screenshots, quit)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist -Filter "Hermes-Studio-Setup-*.exe" | Select-Object -First 1).FullName
          node scripts/clean-test-windows.js "$setup" "$pwd\site\assets\demo-src.mp4" "$pwd\win-shots"
      - name: One-line installer test (install.ps1 from a local copy of the release)
        shell: pwsh
        run: |
          $rel = Join-Path $pwd "fake-release"
          New-Item -ItemType Directory -Force $rel | Out-Null
          $setup = Get-ChildItem dist -Filter "Hermes-Studio-Setup-*.exe" | Select-Object -First 1
          Copy-Item $setup.FullName $rel
          $h = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($setup.Name)" | Out-File -Encoding ascii (Join-Path $rel "SHA256SUMS.txt")
          $srv = Start-Process python -ArgumentList "-m", "http.server", "8765", "--directory", $rel -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $up = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 "http://127.0.0.1:8765/SHA256SUMS.txt" | Out-Null; $up = $true; break } catch { Start-Sleep 2 }
          }
          if (-not $up) { throw "local release server never came up" }
          $env:HERMES_STUDIO_DOWNLOAD_BASE = "http://127.0.0.1:8765"
          Invoke-Expression (Get-Content scripts/install.ps1 -Raw)
          $engine = Join-Path $env:LOCALAPPDATA "Programs\Hermes Studio\resources\engine"
          $cmd = Join-Path $engine "hermes-studio.cmd"
          & $cmd --version
          $doc = & $cmd doctor --json | ConvertFrom-Json
          if (-not $doc.ok) { throw "doctor not ready: $($doc | ConvertTo-Json -Depth 4)" }
          $cfg = & $cmd mcp config --json | ConvertFrom-Json
          if ($cfg.command -ne $cmd) { throw "mcp command is '$($cfg.command)', want '$cmd'" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($userPath -split ";") -notcontains $engine) { throw "command folder not on the user PATH" }
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"t","version":"1"}}}'
          $list = '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          $out = ($init, $list) -join "`n" | & $cmd mcp
          if (-not ($out -match '"name": "run"')) { throw "no tools over MCP: $out" }
          Stop-Process -Id $srv.Id -Force
          "INSTALLER CLEAN TEST PASSED"
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-screenshots
          path: win-shots/
          if-no-files-found: warn
      - name: Installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: dist/Hermes-Studio-Setup-*.exe
          retention-days: 14
  # On a version tag only: publish the exact installers the two clean-machine
  # jobs above just tested, with their checksums. Nothing is rebuilt here.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tested Linux AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-appimage
          path: rel
      - name: Tested Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: rel
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          [ "v$want" = "$TAG" ] || { echo "tag $TAG does not match pyproject version $want"; exit 1; }
          cd rel
          ls -la
          [ -f "Hermes-Studio-$want.AppImage" ] && [ -f "Hermes-Studio-Setup-$want.exe" ] || { echo "missing an installer"; exit 1; }
          sha256sum "Hermes-Studio-$want.AppImage" "Hermes-Studio-Setup-$want.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes="../docs/releases/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Hermes Studio $TAG" "$@" \
            "Hermes-Studio-$want.AppImage" "Hermes-Studio-Setup-$want.exe" SHA256SUMS.txt
